<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Full photo">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4ad66"/>
      <stop offset=".5" stop-color="#cc8e63"/>
      <stop offset="1" stop-color="#9a715759"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f8e7b4"/>
      <stop offset="1" stop-color="#f8e7b4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="h1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9c7a5c"/><stop offset="1" stop-color="#7c6149"/></linearGradient>
    <linearGradient id="h2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b5240"/><stop offset="1" stop-color="#4f3d2f"/></linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>

  <!-- sun + halo, mid frame -->
  <ellipse cx="800" cy="520" rx="560" ry="460" fill="url(#sun)"/>
  <circle cx="800" cy="520" r="150" fill="#f6df9e" opacity=".9"/>

  <!-- birds -->
  <g stroke="#5a4636" stroke-width="5" fill="none" stroke-linecap="round" opacity=".5">
    <path d="M300 250 q18 -20 36 0 q18 -20 36 0"/>
    <path d="M1180 200 q14 -16 28 0 q14 -16 28 0"/>
    <path d="M1320 300 q12 -14 24 0 q12 -14 24 0"/>
  </g>

  <!-- far hills -->
  <path d="M0 700 Q400 640 800 690 T1600 680 V1000 H0 Z" fill="url(#h1)"/>
  <!-- near hill (the couple stands on it) -->
  <path d="M0 800 Q500 740 1000 790 T1600 780 V1000 H0 Z" fill="url(#h2)"/>

  <!-- couple silhouette, centered on the near hill -->
  <g fill="#2a2017">
    <!-- groom -->
    <path d="M726 800 q-4 -120 22 -180 q8 -30 34 -30 q26 0 34 30 q26 60 22 180 Z"/>
    <circle cx="782" cy="540" r="30"/>
    <!-- bride: dress + veil -->
    <path d="M812 800 q-6 -130 22 -190 q10 -34 38 -34 q28 0 38 34 q34 70 46 190 Z"/>
    <circle cx="872" cy="520" r="30"/>
    <path d="M846 500 q26 -22 52 0 l26 250 q-52 18 -104 0 Z" opacity=".5"/>
    <!-- joined hands -->
    <rect x="792" y="640" width="26" height="10" rx="5"/>
  </g>

  <!-- foreground grass tufts (parallax cue) -->
  <g stroke="#33271c" stroke-width="4" stroke-linecap="round" opacity=".85">
    <path d="M120 990 q8 -44 0 -78"/><path d="M150 990 q-8 -40 6 -70"/><path d="M180 990 q10 -46 0 -80"/>
    <path d="M1430 990 q8 -44 0 -78"/><path d="M1460 990 q-8 -40 6 -70"/><path d="M1490 990 q10 -46 0 -80"/>
  </g>

  <text x="800" y="950" text-anchor="middle" font-family="Georgia, serif" font-size="30" letter-spacing="6" fill="#fffdf8" fill-opacity=".5">FULL&#160;PHOTO&#160;&#8212;&#160;REPLACE&#160;ME</text>
</svg>
