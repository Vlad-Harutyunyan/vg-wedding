<svg xmlns="http://www.w3.org/2000/svg" width="800" height="640" viewBox="0 0 800 640" role="img" aria-label="Prime Hall">
  <style>
    @keyframes twinkle { 0%,100%{opacity:.35} 50%{opacity:1} }
    @keyframes pulse   { 0%,100%{opacity:.55} 50%{opacity:1} }
    @keyframes jet     { 0%{transform:translateY(0);opacity:0} 20%{opacity:1} 100%{transform:translateY(-46px);opacity:0} }
    @keyframes ripple  { 0%{transform:scale(.3);opacity:.8} 100%{transform:scale(1.6);opacity:0} }
    @keyframes star    { 0%,100%{opacity:.2} 50%{opacity:1} }
    .lit   { animation:twinkle 3.2s ease-in-out infinite }
    .lit:nth-of-type(2n){ animation-duration:4.1s; animation-delay:.6s }
    .lit:nth-of-type(3n){ animation-duration:2.6s; animation-delay:1.1s }
    .bulb  { animation:pulse 2.4s ease-in-out infinite }
    .bulb:nth-of-type(2n){ animation-delay:.5s }
    .bulb:nth-of-type(3n){ animation-delay:1s }
    .bulb:nth-of-type(4n){ animation-delay:1.5s }
    .drop  { transform-box:fill-box; transform-origin:center; animation:jet 1.8s ease-in infinite }
    .drop:nth-of-type(2){ animation-delay:.6s }
    .drop:nth-of-type(3){ animation-delay:1.2s }
    .rip   { transform-box:fill-box; transform-origin:center; animation:ripple 2.4s ease-out infinite }
    .rip2  { animation-delay:1.2s }
    .star  { animation:star 3s ease-in-out infinite }
    .star:nth-of-type(2n){ animation-duration:4.5s; animation-delay:1s }
    .marquee{ animation:pulse 3s ease-in-out infinite }
    @keyframes stagger { 0%{transform:translateX(0)} 28%{transform:translateX(28px)} 52%{transform:translateX(12px)} 78%{transform:translateX(56px)} 100%{transform:translateX(70px)} }
    @keyframes wobble  { 0%,100%{transform:rotate(-10deg)} 50%{transform:rotate(11deg)} }
    @keyframes hic     { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }
    @keyframes breathe { 0%,100%{transform:scaleY(1)} 50%{transform:scaleY(1.12)} }
    @keyframes zzz     { 0%{transform:translate(0,0); opacity:0} 20%{opacity:.9} 100%{transform:translate(10px,-22px); opacity:0} }
    .drunk   { animation:stagger 26s ease-in-out infinite alternate }
    .drunk-b { transform-box:fill-box; transform-origin:bottom center; animation:wobble 3.2s ease-in-out infinite }
    .drunk-h { transform-box:fill-box; transform-origin:center; animation:hic 3.2s ease-in-out infinite }
    .sleeper-torso { transform-box:fill-box; transform-origin:center; animation:breathe 4s ease-in-out infinite }
    .zzz { transform-box:fill-box; transform-origin:center; animation:zzz 3.4s ease-in-out infinite }
    .zzz:nth-of-type(2){ animation-delay:1.1s }
    .zzz:nth-of-type(3){ animation-delay:2.2s }
  </style>

  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b3830"/>
      <stop offset=".55" stop-color="#7a6049"/>
      <stop offset="1" stop-color="#c79a63"/>
    </linearGradient>
    <linearGradient id="bldg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a5346"/>
      <stop offset="1" stop-color="#46413a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f6dd9c" stop-opacity=".8"/>
      <stop offset="1" stop-color="#f6dd9c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="640" fill="url(#dusk)"/>

  <!-- stars -->
  <g fill="#fff">
    <circle class="star" cx="90"  cy="70"  r="2"/>
    <circle class="star" cx="180" cy="40"  r="1.6"/>
    <circle class="star" cx="300" cy="60"  r="2"/>
    <circle class="star" cx="520" cy="44"  r="1.6"/>
    <circle class="star" cx="650" cy="70"  r="2"/>
    <circle class="star" cx="720" cy="40"  r="1.6"/>
    <circle class="star" cx="430" cy="34"  r="1.4"/>
  </g>

  <!-- moon -->
  <circle cx="690" cy="120" r="34" fill="#f3e6c4"/>
  <circle cx="678" cy="112" r="34" fill="url(#dusk)" opacity=".9"/>

  <!-- string lights -->
  <path d="M40 150 Q400 230 760 150" fill="none" stroke="#6e6450" stroke-width="2"/>
  <g fill="#f6dd9c">
    <circle class="bulb" cx="120" cy="184" r="5"/>
    <circle class="bulb" cx="220" cy="200" r="5"/>
    <circle class="bulb" cx="320" cy="210" r="5"/>
    <circle class="bulb" cx="420" cy="212" r="5"/>
    <circle class="bulb" cx="520" cy="208" r="5"/>
    <circle class="bulb" cx="620" cy="198" r="5"/>
    <circle class="bulb" cx="700" cy="182" r="5"/>
  </g>

  <!-- ground / plaza -->
  <rect x="0" y="516" width="800" height="124" fill="#3f3a32"/>
  <rect x="0" y="516" width="800" height="8" fill="#564f43"/>

  <!-- ===== building ===== -->
  <g>
    <!-- glow halo behind -->
    <ellipse cx="400" cy="380" rx="300" ry="180" fill="url(#glow)" opacity=".5"/>

    <rect x="200" y="250" width="400" height="266" fill="url(#bldg)" stroke="#33302a" stroke-width="2"/>
    <!-- cornice -->
    <rect x="186" y="234" width="428" height="20" fill="#6a6151"/>
    <!-- columns / pillars -->
    <g fill="#6f6657">
      <rect x="216" y="254" width="22" height="262"/>
      <rect x="562" y="254" width="22" height="262"/>
    </g>

    <!-- glass facade grid (lit windows) -->
    <g>
      <rect class="lit" x="256" y="276" width="40" height="58" fill="#f6dd9c"/>
      <rect class="lit" x="306" y="276" width="40" height="58" fill="#f3d489"/>
      <rect class="lit" x="356" y="276" width="40" height="58" fill="#f6dd9c"/>
      <rect class="lit" x="406" y="276" width="40" height="58" fill="#f0cd7c"/>
      <rect class="lit" x="456" y="276" width="40" height="58" fill="#f6dd9c"/>
      <rect class="lit" x="506" y="276" width="40" height="58" fill="#f3d489"/>

      <rect class="lit" x="256" y="346" width="40" height="58" fill="#f0cd7c"/>
      <rect class="lit" x="306" y="346" width="40" height="58" fill="#f6dd9c"/>
      <rect class="lit" x="356" y="346" width="40" height="58" fill="#f3d489"/>
      <rect class="lit" x="406" y="346" width="40" height="58" fill="#f6dd9c"/>
      <rect class="lit" x="456" y="346" width="40" height="58" fill="#f0cd7c"/>
      <rect class="lit" x="506" y="346" width="40" height="58" fill="#f6dd9c"/>
    </g>

    <!-- grand arched entrance -->
    <path d="M356 516 V452 a44 44 0 0 1 88 0 V516Z" fill="#f6dd9c"/>
    <path d="M356 516 V452 a44 44 0 0 1 88 0 V516Z" fill="none" stroke="#caa766" stroke-width="3"/>
    <line x1="400" y1="408" x2="400" y2="516" stroke="#caa766" stroke-width="2"/>
    <!-- entrance steps -->
    <rect x="338" y="516" width="124" height="9" fill="#4d473d"/>
    <rect x="320" y="525" width="160" height="10" fill="#433e35"/>

    <!-- marquee sign -->
    <rect class="marquee" x="318" y="206" width="164" height="30" rx="6" fill="#1f1d18" stroke="#caa766" stroke-width="2"/>
    <text class="marquee" x="400" y="227" text-anchor="middle" font-family="Georgia, serif" font-size="18" letter-spacing="5" fill="#f6dd9c">PRIME&#160;HALL</text>
  </g>

  <!-- fountain -->
  <g>
    <ellipse cx="400" cy="560" rx="70" ry="18" fill="#5b6a6b"/>
    <ellipse cx="400" cy="558" rx="70" ry="16" fill="#7d9596"/>
    <ellipse class="rip"  cx="400" cy="558" rx="22" ry="6" fill="none" stroke="#cfe0e0" stroke-width="2"/>
    <ellipse class="rip rip2" cx="400" cy="558" rx="22" ry="6" fill="none" stroke="#cfe0e0" stroke-width="2"/>
    <rect x="394" y="540" width="12" height="20" fill="#5b6a6b"/>
    <g fill="#cfe6e6">
      <circle class="drop" cx="400" cy="540" r="3"/>
      <circle class="drop" cx="394" cy="542" r="2.5"/>
      <circle class="drop" cx="406" cy="542" r="2.5"/>
    </g>
  </g>

  <!-- passed-out guest sleeping by the left tree, bottle beside him -->
  <g>
    <ellipse cx="180" cy="552" rx="34" ry="7" fill="#000" opacity=".18"/>
    <!-- legs -->
    <rect x="196" y="544" width="22" height="8" rx="4" fill="#26231e"/>
    <rect x="208" y="540" width="20" height="8" rx="4" fill="#2f2b26" transform="rotate(-12 208 544)"/>
    <!-- torso -->
    <rect class="sleeper-torso" x="162" y="540" width="42" height="12" rx="6" fill="#52372a"/>
    <!-- head -->
    <circle cx="158" cy="544" r="7.5" fill="#e8c4a0"/>
    <path d="M150.5 544 a7.5 7.5 0 0 1 15 0 q-7.5 3.4 -15 0 Z" fill="#2e2014"/>
    <!-- bottle tipped beside him -->
    <g transform="rotate(-18 142 548)">
      <rect x="132" y="544" width="14" height="6" rx="2" fill="#6f8d6a"/>
      <rect x="146" y="545" width="4" height="4" fill="#6f8d6a"/>
    </g>
    <!-- zzz -->
    <g fill="#cfe6e6" font-family="Georgia, serif" font-weight="bold">
      <text class="zzz" x="168" y="528" font-size="11">z</text>
      <text class="zzz" x="176" y="520" font-size="13">z</text>
      <text class="zzz" x="184" y="512" font-size="15">z</text>
    </g>
  </g>

  <!-- tipsy guest staggering across the plaza -->
  <g class="drunk">
   <g transform="translate(244,500)">
    <g class="drunk-b">
      <!-- legs -->
      <rect x="-6" y="34" width="5" height="16" rx="2" fill="#26231e"/>
      <rect x="2" y="34" width="5" height="16" rx="2" fill="#26231e"/>
      <!-- suit jacket -->
      <rect x="-9" y="13" width="18" height="26" rx="5" fill="#52372a"/>
      <!-- shirt -->
      <path d="M-2 14 L2 14 L1 26 L-1 26 Z" fill="#d8cbb6"/>
      <!-- raised arm with bottle -->
      <g class="drunk-h">
        <rect x="6" y="14" width="4" height="15" rx="2" fill="#52372a" transform="rotate(48 8 15)"/>
        <rect x="17" y="16" width="5" height="12" rx="2" fill="#6f8d6a"/>
        <rect x="18" y="13" width="3" height="5" fill="#6f8d6a"/>
      </g>
      <!-- other arm -->
      <rect x="-10" y="16" width="4" height="16" rx="2" fill="#52372a" transform="rotate(-22 -8 17)"/>
      <!-- head -->
      <circle cx="0" cy="6" r="6" fill="#e8c4a0"/>
      <!-- flushed cheeks -->
      <circle cx="-3" cy="8" r="1.6" fill="#d98b6e" opacity=".7"/>
      <circle cx="3" cy="8" r="1.6" fill="#d98b6e" opacity=".7"/>
      <!-- hair -->
      <path d="M-6 6 a6 6 0 0 1 12 0 q-6 2.7 -12 0 Z" fill="#2e2014"/>
    </g>
   </g>
  </g>

  <!-- potted trees -->
  <g>
    <rect x="150" y="486" width="16" height="30" fill="#5a4632"/>
    <circle cx="158" cy="476" r="24" fill="#5f6a47"/>
    <rect x="634" y="486" width="16" height="30" fill="#5a4632"/>
    <circle cx="642" cy="476" r="24" fill="#5f6a47"/>
  </g>
</svg>
