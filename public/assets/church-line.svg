<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-label="Saint Gregory the Illuminator Cathedral">
  <g fill="none" stroke="#b08d57" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">

    <!-- ===== far-right small chapel ===== -->
    <g>
      <rect x="452" y="276" width="56" height="86"/>
      <line x1="452" y1="302" x2="508" y2="302" stroke-width="0.8" opacity=".6"/>
      <rect x="470" y="250" width="20" height="26"/>
      <g stroke-width="0.8" opacity=".7"><line x1="476" y1="250" x2="476" y2="276"/><line x1="484" y1="250" x2="484" y2="276"/></g>
      <polyline points="462,250 480,200 498,250"/>
      <g stroke-width="0.7" opacity=".65"><line x1="480" y1="206" x2="468" y2="246"/><line x1="480" y1="206" x2="492" y2="246"/></g>
      <line x1="480" y1="200" x2="480" y2="184"/><line x1="473" y1="191" x2="487" y2="191"/>
      <path d="M468 362 V330 a10 10 0 0 1 20 0 V362"/>
      <path d="M494 322 a6 6 0 0 1 12 0 V338 H494 Z" stroke-width="0.9"/>
    </g>

    <!-- ===== right chapel ===== -->
    <g>
      <rect x="362" y="252" width="78" height="110"/>
      <line x1="362" y1="284" x2="440" y2="284" stroke-width="0.8" opacity=".6"/>
      <rect x="386" y="222" width="30" height="30"/>
      <g stroke-width="0.8" opacity=".7"><line x1="394" y1="222" x2="394" y2="252"/><line x1="404" y1="222" x2="404" y2="252"/><line x1="412" y1="222" x2="412" y2="252"/></g>
      <polyline points="372,222 401,156 430,222"/>
      <polyline points="382,222 401,176 420,222" stroke-width="0.8" opacity=".7"/>
      <g stroke-width="0.7" opacity=".65"><line x1="401" y1="162" x2="384" y2="218"/><line x1="401" y1="162" x2="418" y2="218"/></g>
      <line x1="401" y1="156" x2="401" y2="138"/><line x1="392" y1="147" x2="410" y2="147"/>
      <path d="M376 362 V326 a12 12 0 0 1 24 0 V362"/>
      <path d="M410 362 V336 a9 9 0 0 1 18 0 V362"/>
    </g>

    <!-- ===== central main cathedral (tallest, behind) ===== -->
    <g>
      <rect x="236" y="248" width="104" height="114"/>
      <!-- blind arcade -->
      <g stroke-width="0.8" opacity=".75"><path d="M246 282 a8 8 0 0 1 16 0"/><path d="M268 282 a8 8 0 0 1 16 0"/><path d="M314 282 a8 8 0 0 1 16 0"/></g>
      <rect x="256" y="206" width="64" height="42"/>
      <rect x="270" y="172" width="36" height="34"/>
      <rect x="276" y="128" width="24" height="44"/>
      <g stroke-width="0.8" opacity=".75"><line x1="284" y1="128" x2="284" y2="172"/><line x1="292" y1="128" x2="292" y2="172"/></g>
      <!-- tall ribbed conical dome -->
      <polyline points="262,128 288,52 314,128"/>
      <polyline points="270,128 288,72 306,128" stroke-width="0.8" opacity=".7"/>
      <g stroke-width="0.7" opacity=".7"><line x1="288" y1="58" x2="268" y2="124"/><line x1="288" y1="58" x2="278" y2="126"/><line x1="288" y1="58" x2="298" y2="126"/><line x1="288" y1="58" x2="308" y2="124"/></g>
      <line x1="288" y1="52" x2="288" y2="30"/><line x1="278" y1="41" x2="298" y2="41"/>
      <!-- rosette -->
      <circle cx="288" cy="226" r="11"/><circle cx="288" cy="226" r="5" stroke-width="0.8"/>
      <g stroke-width="0.7" opacity=".7"><line x1="277" y1="226" x2="299" y2="226"/><line x1="288" y1="215" x2="288" y2="237"/></g>
      <!-- portals -->
      <path d="M250 362 V322 a14 14 0 0 1 28 0 V362"/>
      <path d="M298 362 V322 a14 14 0 0 1 28 0 V362"/>
      <line x1="264" y1="308" x2="264" y2="362" stroke-width="0.8" opacity=".5"/>
    </g>

    <!-- ===== left domed tower (prominent, front) ===== -->
    <g>
      <rect x="118" y="232" width="80" height="130"/>
      <line x1="118" y1="262" x2="198" y2="262" stroke-width="0.8" opacity=".6"/>
      <rect x="140" y="196" width="36" height="36"/>
      <g stroke-width="0.8" opacity=".7"><line x1="150" y1="196" x2="150" y2="232"/><line x1="158" y1="196" x2="158" y2="232"/><line x1="166" y1="196" x2="166" y2="232"/></g>
      <polyline points="128,196 158,118 188,196"/>
      <polyline points="138,196 158,140 178,196" stroke-width="0.8" opacity=".7"/>
      <g stroke-width="0.7" opacity=".65"><line x1="158" y1="124" x2="140" y2="192"/><line x1="158" y1="124" x2="148" y2="194"/><line x1="158" y1="124" x2="168" y2="194"/><line x1="158" y1="124" x2="176" y2="192"/></g>
      <line x1="158" y1="118" x2="158" y2="98"/><line x1="148" y1="108" x2="168" y2="108"/>
      <!-- arcaded base: 3 arches -->
      <path d="M124 362 V338 a9 9 0 0 1 18 0 V362"/>
      <path d="M149 362 V330 a11 11 0 0 1 22 0 V362"/>
      <path d="M180 362 V338 a9 9 0 0 1 18 0 V362"/>
      <!-- side window -->
      <circle cx="158" cy="286" r="9"/><line x1="149" y1="286" x2="167" y2="286" stroke-width="0.7"/><line x1="158" y1="277" x2="158" y2="295" stroke-width="0.7"/>
    </g>

    <!-- ===== podium + grand staircase (descending left) ===== -->
    <line x1="110" y1="362" x2="520" y2="362"/>
    <line x1="110" y1="362" x2="520" y2="362"/>
    <polygon points="110,362 520,362 520,372 110,372"/>
    <g>
      <polyline points="110,372 70,392 470,392 520,372"/>
      <polyline points="92,382 50,404 452,404 470,392" stroke-width="1.1"/>
      <polyline points="74,392 40,414 436,414 452,404" stroke-width="1"/>
    </g>

    <!-- ===== cypress trees ===== -->
    <g>
      <path d="M566 392 C550 342 561 270 568 248 C575 270 588 342 570 392"/>
      <g stroke-width="0.8" opacity=".7"><path d="M568 264 l-9 14 M568 264 l9 14 M568 300 l-11 15 M568 300 l11 15 M568 336 l-12 16 M568 336 l12 16"/></g>
    </g>
  </g>
</svg>
