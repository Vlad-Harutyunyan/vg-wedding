<svg xmlns="http://www.w3.org/2000/svg" width="800" height="640" viewBox="0 0 800 640" role="img" aria-label="Saint Gregory the Illuminator Cathedral">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6d6bd"/><stop offset="1" stop-color="#f8efe1"/>
    </linearGradient>
    <radialGradient id="halo2" cx="50%" cy="34%" r="60%">
      <stop offset="0" stop-color="#f6e6b8"/><stop offset="1" stop-color="#f6e6b8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e3d6c1"/><stop offset=".5" stop-color="#d9c9b1"/><stop offset="1" stop-color="#c6b394"/>
    </linearGradient>
    <linearGradient id="stoneDk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cdb99e"/><stop offset="1" stop-color="#b7a182"/>
    </linearGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d3c1a6"/><stop offset=".5" stop-color="#c2ac8c"/><stop offset="1" stop-color="#a98f6d"/>
    </linearGradient>
  </defs>
  <rect width="800" height="640" fill="url(#sky2)"/>

  <ellipse cx="400" cy="150" rx="260" ry="220" fill="url(#halo2)">
    <animate attributeName="opacity" values=".45;.95;.45" dur="8s" repeatCount="indefinite"/>
  </ellipse>

  <g fill="#fffdf8" opacity=".8">
    <g><animateTransform attributeName="transform" type="translate" from="-40 0" to="880 0" dur="64s" repeatCount="indefinite"/>
      <ellipse cx="150" cy="110" rx="44" ry="18"/><ellipse cx="184" cy="102" rx="30" ry="15"/></g>
    <g><animateTransform attributeName="transform" type="translate" from="-40 0" to="880 0" dur="84s" begin="-30s" repeatCount="indefinite"/>
      <ellipse cx="120" cy="200" rx="40" ry="16"/><ellipse cx="150" cy="194" rx="26" ry="13"/></g>
  </g>

  <!-- circling birds -->
  <g stroke="#6b6353" stroke-width="3" fill="none" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="0 400 150" to="360 400 150" dur="46s" repeatCount="indefinite"/>
    <path d="M610 110 q7 -8 14 0 q7 -8 14 0"/>
    <path d="M656 142 q6 -7 12 0 q6 -7 12 0"/>
    <path d="M170 168 q6 -7 12 0 q6 -7 12 0"/>
  </g>

  <!-- ground -->
  <rect x="0" y="520" width="800" height="120" fill="#cbbfa6"/>
  <rect x="0" y="520" width="800" height="9" fill="#bcae90"/>
  <ellipse cx="400" cy="566" rx="390" ry="32" fill="#000" opacity=".05"/>

  <!-- left chapel -->
  <g>
    <rect x="120" y="396" width="118" height="124" fill="url(#stoneDk)" stroke="#a78f70" stroke-width="2"/>
    <rect x="164" y="372" width="30" height="30" fill="#c9b596"/>
    <polygon points="150,372 179,300 208,372" fill="url(#cone)" stroke="#9a8164" stroke-width="2"/>
    <g stroke="#9a8164" stroke-width="1.5" opacity=".5"><line x1="179" y1="306" x2="160" y2="368"/><line x1="179" y1="306" x2="198" y2="368"/></g>
    <line x1="179" y1="300" x2="179" y2="282" stroke="#8c7a5e" stroke-width="3"/>
    <line x1="171" y1="290" x2="187" y2="290" stroke="#8c7a5e" stroke-width="3"/>
    <path d="M165 520 V452 a14 14 0 0 1 28 0 V520Z" fill="#a88f6f"/>
    <rect x="138" y="420" width="14" height="30" rx="7" fill="#b59f7d"/>
    <rect x="206" y="420" width="14" height="30" rx="7" fill="#b59f7d"/>
  </g>

  <!-- right chapel -->
  <g>
    <rect x="562" y="396" width="118" height="124" fill="url(#stoneDk)" stroke="#a78f70" stroke-width="2"/>
    <rect x="606" y="372" width="30" height="30" fill="#c9b596"/>
    <polygon points="592,372 621,300 650,372" fill="url(#cone)" stroke="#9a8164" stroke-width="2"/>
    <g stroke="#9a8164" stroke-width="1.5" opacity=".5"><line x1="621" y1="306" x2="602" y2="368"/><line x1="621" y1="306" x2="640" y2="368"/></g>
    <line x1="621" y1="300" x2="621" y2="282" stroke="#8c7a5e" stroke-width="3"/>
    <line x1="613" y1="290" x2="629" y2="290" stroke="#8c7a5e" stroke-width="3"/>
    <path d="M607 520 V452 a14 14 0 0 1 28 0 V520Z" fill="#a88f6f"/>
    <rect x="580" y="420" width="14" height="30" rx="7" fill="#b59f7d"/>
    <rect x="648" y="420" width="14" height="30" rx="7" fill="#b59f7d"/>
  </g>

  <!-- central cathedral -->
  <g>
    <rect x="282" y="392" width="236" height="128" fill="url(#stone)" stroke="#b3a085" stroke-width="2"/>
    <rect x="312" y="318" width="176" height="78" fill="url(#stoneDk)" stroke="#b3a085" stroke-width="2"/>
    <rect x="340" y="276" width="120" height="46" fill="#cebb9f" stroke="#b3a085" stroke-width="2"/>
    <rect x="362" y="206" width="76" height="74" fill="#d8c8b1" stroke="#b3a085" stroke-width="2"/>
    <g stroke="#b3a085" stroke-width="1.5" opacity=".7">
      <line x1="384" y1="206" x2="384" y2="280"/><line x1="400" y1="206" x2="400" y2="280"/><line x1="416" y1="206" x2="416" y2="280"/>
    </g>
    <g fill="#b39f80"><rect x="372" y="224" width="8" height="34" rx="4"/><rect x="396" y="224" width="8" height="34" rx="4"/><rect x="420" y="224" width="8" height="34" rx="4"/></g>
    <polygon points="348,206 400,72 452,206" fill="url(#cone)" stroke="#977f60" stroke-width="2"/>
    <g stroke="#9a8164" stroke-width="1.5" opacity=".5">
      <line x1="400" y1="80" x2="366" y2="200"/><line x1="400" y1="80" x2="384" y2="200"/><line x1="400" y1="80" x2="416" y2="200"/><line x1="400" y1="80" x2="434" y2="200"/>
    </g>
    <g>
      <line x1="400" y1="72" x2="400" y2="40" stroke="#8c7a5e" stroke-width="4"/>
      <line x1="386" y1="54" x2="414" y2="54" stroke="#8c7a5e" stroke-width="4"/>
      <circle cx="400" cy="48" r="16" fill="#f6e6b8">
        <animate attributeName="r" values="11;20;11" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".2;.9;.2" dur="4s" repeatCount="indefinite"/>
      </circle>
    </g>
    <circle cx="400" cy="350" r="17" fill="none" stroke="#9c876a" stroke-width="2.5"/>
    <g stroke="#9c876a" stroke-width="1.5"><line x1="383" y1="350" x2="417" y2="350"/><line x1="400" y1="333" x2="400" y2="367"/></g>
    <g fill="#a88f6f" stroke="#937c5e" stroke-width="2">
      <path d="M312 520 V464 a26 26 0 0 1 52 0 V520Z"/>
      <path d="M374 520 V452 a26 26 0 0 1 52 0 V520Z"/>
      <path d="M436 520 V464 a26 26 0 0 1 52 0 V520Z"/>
    </g>
    <line x1="400" y1="436" x2="400" y2="520" stroke="#7d6749" stroke-width="2"/>
    <rect x="300" y="520" width="200" height="10" fill="#c0b294"/>
    <rect x="282" y="530" width="236" height="11" fill="#b3a587"/>
  </g>

  <!-- priest walking in front of the cathedral -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;190 0;0 0" dur="22s" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" repeatCount="indefinite"/>
    <g transform="translate(296,472)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="0.62s" repeatCount="indefinite"/>
        <rect x="-5" y="34" width="5" height="16" rx="2" fill="#211f1b">
          <animateTransform attributeName="transform" type="rotate" values="14 -2.5 34;-14 -2.5 34;14 -2.5 34" dur="0.62s" repeatCount="indefinite"/>
        </rect>
        <rect x="1" y="34" width="5" height="16" rx="2" fill="#211f1b">
          <animateTransform attributeName="transform" type="rotate" values="-14 3.5 34;14 3.5 34;-14 3.5 34" dur="0.62s" repeatCount="indefinite"/>
        </rect>
        <path d="M-11 50 L-8 16 q8 -9 16 0 L11 50 Z" fill="#2c2a26"/>
        <rect x="-12" y="18" width="5" height="22" rx="2.5" fill="#2c2a26" transform="rotate(8 -9 19)"/>
        <rect x="7" y="18" width="5" height="22" rx="2.5" fill="#2c2a26" transform="rotate(-8 9 19)"/>
        <line x1="0" y1="24" x2="0" y2="34" stroke="#caa766" stroke-width="2"/>
        <line x1="-3" y1="28" x2="3" y2="28" stroke="#caa766" stroke-width="2"/>
        <path d="M-5 7 q5 12 10 0 Z" fill="#6a635c"/>
        <circle cx="0" cy="5" r="6" fill="#e6c19c"/>
        <path d="M-7 3 q7 -20 14 0 Z" fill="#1a1815"/>
      </g>
    </g>
  </g>

  <text x="400" y="606" text-anchor="middle" font-family="Georgia, serif" font-size="19" letter-spacing="3" fill="#5f5747">ST&#160;GREGORY&#160;THE&#160;ILLUMINATOR</text>
</svg>
