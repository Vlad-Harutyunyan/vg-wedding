<svg xmlns="http://www.w3.org/2000/svg" width="800" height="640" viewBox="0 0 800 640" role="img" aria-label="Inside the ceremony">
  <style>
    @keyframes flick { 0%,100%{transform:scaleY(1);opacity:.85} 50%{transform:scaleY(1.3);opacity:1} }
    @keyframes sway  { 0%,100%{transform:rotate(-2.5deg)} 50%{transform:rotate(2.5deg)} }
    @keyframes bless { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-2px)} }
    @keyframes shimmer{ 0%,100%{opacity:.5} 50%{opacity:.9} }
    .flame { transform-box:fill-box; transform-origin:bottom center; animation:flick 1.1s ease-in-out infinite }
    .flame:nth-of-type(2n){ animation-delay:.35s } .flame:nth-of-type(3n){ animation-delay:.7s } .flame:nth-of-type(4n){ animation-delay:.9s }
    .chand { transform-box:fill-box; transform-origin:top center; animation:sway 6s ease-in-out infinite }
    .priest{ transform-box:fill-box; transform-origin:bottom center; animation:bless 4.2s ease-in-out infinite }
    .halo  { animation:shimmer 4s ease-in-out infinite }
  </style>
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8c8b0"/><stop offset="1" stop-color="#bca886"/>
    </linearGradient>
    <linearGradient id="apse" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8d59f"/><stop offset="1" stop-color="#c7a85f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="55%">
      <stop offset="0" stop-color="#f6e6b0" stop-opacity=".8"/><stop offset="1" stop-color="#f6e6b0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="640" fill="url(#stone)"/>

  <!-- side columns / arches -->
  <g fill="#c6b491" stroke="#a8946f" stroke-width="2">
    <rect x="60" y="120" width="48" height="430"/><rect x="692" y="120" width="48" height="430"/>
    <path d="M60 120 q24 -40 48 0 Z" fill="#bca886"/><path d="M692 120 q24 -40 48 0 Z" fill="#bca886"/>
  </g>
  <g fill="#cdbb98" stroke="#a8946f" stroke-width="2">
    <path d="M150 250 V150 a26 26 0 0 1 52 0 V250Z" opacity=".5"/>
    <path d="M598 250 V150 a26 26 0 0 1 52 0 V250Z" opacity=".5"/>
  </g>

  <!-- apse with semi-dome behind the altar -->
  <ellipse class="halo" cx="400" cy="250" rx="220" ry="200" fill="url(#glow)"/>
  <path d="M300 360 V210 a100 100 0 0 1 200 0 V360 Z" fill="url(#apse)" stroke="#b6954f" stroke-width="2"/>
  <g stroke="#b6954f" stroke-width="1.5" opacity=".5">
    <line x1="340" y1="360" x2="362" y2="170"/><line x1="400" y1="360" x2="400" y2="150"/><line x1="460" y1="360" x2="438" y2="170"/>
  </g>
  <!-- altar cross + halo -->
  <g>
    <line x1="400" y1="200" x2="400" y2="150" stroke="#8c6f2e" stroke-width="6"/>
    <line x1="378" y1="172" x2="422" y2="172" stroke="#8c6f2e" stroke-width="6"/>
    <circle class="halo" cx="400" cy="166" r="20" fill="#f6e6b0"/>
  </g>

  <!-- hanging chandelier -->
  <g class="chand">
    <line x1="400" y1="0" x2="400" y2="78" stroke="#9a8252" stroke-width="3"/>
    <ellipse cx="400" cy="92" rx="56" ry="12" fill="none" stroke="#b69a5c" stroke-width="3"/>
    <g fill="#f3b24a"><circle cx="356" cy="92" r="3"/><circle cx="378" cy="96" r="3"/><circle cx="400" cy="98" r="3"/><circle cx="422" cy="96" r="3"/><circle cx="444" cy="92" r="3"/></g>
    <g fill="#f6e3a0">
      <ellipse class="flame" cx="356" cy="86" rx="3" ry="7"/><ellipse class="flame" cx="378" cy="90" rx="3" ry="7"/>
      <ellipse class="flame" cx="400" cy="92" rx="3" ry="7"/><ellipse class="flame" cx="422" cy="90" rx="3" ry="7"/><ellipse class="flame" cx="444" cy="86" rx="3" ry="7"/>
    </g>
  </g>

  <!-- altar table -->
  <rect x="344" y="356" width="112" height="46" rx="3" fill="#b89a64" stroke="#9a8252" stroke-width="2"/>
  <rect x="336" y="350" width="128" height="10" rx="3" fill="#caa765"/>
  <!-- altar candelabra -->
  <g>
    <rect x="356" y="332" width="5" height="20" fill="#9a8252"/><rect x="439" y="332" width="5" height="20" fill="#9a8252"/>
    <ellipse class="flame" cx="358.5" cy="326" rx="3.5" ry="9" fill="#f6e3a0"/>
    <ellipse class="flame" cx="441.5" cy="326" rx="3.5" ry="9" fill="#f6e3a0"/>
  </g>

  <!-- red aisle carpet -->
  <polygon points="330,640 470,640 440,402 360,402" fill="#9c4f4a"/>
  <polygon points="360,402 440,402 438,418 362,418" fill="#b5635c"/>

  <!-- floor -->
  <rect x="0" y="548" width="800" height="92" fill="#a8946f"/>

  <!-- priest behind altar, blessing -->
  <g class="priest">
    <g transform="translate(400,338)">
      <path d="M-15 18 L-12 -16 q12 -10 24 0 L15 18 Z" fill="#2c2a26"/>
      <!-- raised blessing arms -->
      <rect x="-17" y="-12" width="5" height="22" rx="2.5" fill="#2c2a26" transform="rotate(34 -14 -10)"/>
      <rect x="12" y="-12" width="5" height="22" rx="2.5" fill="#2c2a26" transform="rotate(-34 14 -10)"/>
      <line x1="0" y1="-4" x2="0" y2="8" stroke="#caa766" stroke-width="2"/><line x1="-3" y1="0" x2="3" y2="0" stroke="#caa766" stroke-width="2"/>
      <path d="M-5 -16 q5 11 10 0 Z" fill="#6a635c"/>
      <circle cx="0" cy="-18" r="6.5" fill="#e6c19c"/>
      <path d="M-7 -20 q7 -20 14 0 Z" fill="#1a1815"/>
    </g>
  </g>

  <!-- the couple, seen from behind, facing the altar -->
  <!-- groom -->
  <g transform="translate(372,470)">
    <rect x="-7" y="22" width="7" height="26" rx="2.5" fill="#26242e"/><rect x="2" y="22" width="7" height="26" rx="2.5" fill="#26242e"/>
    <path d="M-13 -22 q13 -9 26 0 L11 24 L-11 24 Z" fill="#3a3744"/>
    <circle cx="0" cy="-30" r="11" fill="#e6c19c"/>
    <path d="M-11 -32 q11 -10 22 0 l-2 8 q-9 -5 -18 0 Z" fill="#2e2014"/>
  </g>
  <!-- bride with long veil -->
  <g transform="translate(428,470)">
    <path d="M-20 48 q-6 -52 20 -78 q26 26 20 78 Z" fill="#fffefb"/>
    <path d="M-9 -28 q9 -8 18 0 L9 -2 L-9 -2 Z" fill="#fffefb"/>
    <circle cx="0" cy="-34" r="11" fill="#eecaa6"/>
    <path d="M-11 -38 q11 -10 22 0 l-3 12 q-8 -5 -16 0 Z" fill="#5a3a22"/>
    <!-- long veil trailing down -->
    <path d="M-12 -38 q-12 30 -6 84 L18 84 q6 -54 -6 -84 q-6 -6 -12 0 Z" fill="#fffefb" opacity=".55"/>
    <circle cx="0" cy="-43" r="3" fill="#e9cf86"/>
  </g>

  <!-- family / guests in the pews -->
  <g>
    <!-- left pews -->
    <rect x="150" y="470" width="120" height="10" rx="2" fill="#8a7458"/>
    <rect x="150" y="520" width="120" height="10" rx="2" fill="#8a7458"/>
    <g>
      <g transform="translate(180,468) scale(.78)" stroke="#2a2520" stroke-width="3" fill="#fffefb" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-11 18 C-12 -2 -7 -11 0 -11 C7 -11 12 -2 11 18 Z"/>
        <circle cx="0" cy="-20" r="9"/>
        <path d="M-9 -22 C-10 -31 -1 -34 6 -33 C11 -32 12 -27 11 -22 C7 -26 0 -26 -4 -24 C-7 -23 -8 -22 -9 -22 Z" fill="#2a2520" stroke="none"/>
        <circle cx="-3.5" cy="-19" r="1.6" fill="#2a2520" stroke="none"/><circle cx="3.5" cy="-19" r="1.6" fill="#2a2520" stroke="none"/>
        <path d="M-3.5 -15 Q0 -12 3.5 -15" fill="none" stroke-width="1.7"/></g>
      <g transform="translate(214,468) scale(.78)" stroke="#2a2520" stroke-width="3" fill="#fffefb" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-11 18 C-12 -2 -7 -11 0 -11 C7 -11 12 -2 11 18 Z"/>
        <circle cx="0" cy="-21" r="10" fill="#2a2520" stroke="none"/>
        <path d="M-10 -21 C-11 -10 -8 -2 -5 1 L-2 1 C-5 -8 -6 -16 -6 -21 Z" fill="#2a2520" stroke="none"/>
        <path d="M10 -21 C11 -10 8 -2 5 1 L2 1 C5 -8 6 -16 6 -21 Z" fill="#2a2520" stroke="none"/>
        <circle cx="0" cy="-20" r="8"/>
        <circle cx="-3" cy="-19" r="1.5" fill="#2a2520" stroke="none"/><circle cx="3" cy="-19" r="1.5" fill="#2a2520" stroke="none"/>
        <path d="M-3 -15 Q0 -12 3 -15" fill="none" stroke-width="1.7"/></g>
      <g transform="translate(248,468) scale(.78)" stroke="#2a2520" stroke-width="3" fill="#fffefb" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-11 18 C-12 -2 -7 -11 0 -11 C7 -11 12 -2 11 18 Z"/>
        <circle cx="0" cy="-20" r="9"/>
        <path d="M-9 -22 C-10 -31 -1 -34 6 -33 C11 -32 12 -27 11 -22 C7 -26 0 -26 -4 -24 C-7 -23 -8 -22 -9 -22 Z" fill="#2a2520" stroke="none"/>
        <circle cx="-3.5" cy="-19" r="1.6" fill="#2a2520" stroke="none"/><circle cx="3.5" cy="-19" r="1.6" fill="#2a2520" stroke="none"/>
        <path d="M-3.5 -15 Q0 -12 3.5 -15" fill="none" stroke-width="1.7"/></g>
    </g>
    <!-- right pews -->
    <rect x="530" y="470" width="120" height="10" rx="2" fill="#8a7458"/>
    <rect x="530" y="520" width="120" height="10" rx="2" fill="#8a7458"/>
    <g>
      <g transform="translate(556,468) scale(.78)" stroke="#2a2520" stroke-width="3" fill="#fffefb" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-11 18 C-12 -2 -7 -11 0 -11 C7 -11 12 -2 11 18 Z"/>
        <circle cx="0" cy="-21" r="10" fill="#2a2520" stroke="none"/>
        <path d="M-10 -21 C-11 -10 -8 -2 -5 1 L-2 1 C-5 -8 -6 -16 -6 -21 Z" fill="#2a2520" stroke="none"/>
        <path d="M10 -21 C11 -10 8 -2 5 1 L2 1 C5 -8 6 -16 6 -21 Z" fill="#2a2520" stroke="none"/>
        <circle cx="0" cy="-20" r="8"/>
        <circle cx="-3" cy="-19" r="1.5" fill="#2a2520" stroke="none"/><circle cx="3" cy="-19" r="1.5" fill="#2a2520" stroke="none"/>
        <path d="M-3 -15 Q0 -12 3 -15" fill="none" stroke-width="1.7"/></g>
      <g transform="translate(590,468) scale(.78)" stroke="#2a2520" stroke-width="3" fill="#fffefb" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-11 18 C-12 -2 -7 -11 0 -11 C7 -11 12 -2 11 18 Z"/>
        <circle cx="0" cy="-20" r="9"/>
        <path d="M-9 -22 C-10 -31 -1 -34 6 -33 C11 -32 12 -27 11 -22 C7 -26 0 -26 -4 -24 C-7 -23 -8 -22 -9 -22 Z" fill="#2a2520" stroke="none"/>
        <circle cx="-3.5" cy="-19" r="1.6" fill="#2a2520" stroke="none"/><circle cx="3.5" cy="-19" r="1.6" fill="#2a2520" stroke="none"/>
        <path d="M-3.5 -15 Q0 -12 3.5 -15" fill="none" stroke-width="1.7"/></g>
      <g transform="translate(624,468) scale(.78)" stroke="#2a2520" stroke-width="3" fill="#fffefb" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-11 18 C-12 -2 -7 -11 0 -11 C7 -11 12 -2 11 18 Z"/>
        <circle cx="0" cy="-21" r="10" fill="#2a2520" stroke="none"/>
        <path d="M-10 -21 C-11 -10 -8 -2 -5 1 L-2 1 C-5 -8 -6 -16 -6 -21 Z" fill="#2a2520" stroke="none"/>
        <path d="M10 -21 C11 -10 8 -2 5 1 L2 1 C5 -8 6 -16 6 -21 Z" fill="#2a2520" stroke="none"/>
        <circle cx="0" cy="-20" r="8"/>
        <circle cx="-3" cy="-19" r="1.5" fill="#2a2520" stroke="none"/><circle cx="3" cy="-19" r="1.5" fill="#2a2520" stroke="none"/>
        <path d="M-3 -15 Q0 -12 3 -15" fill="none" stroke-width="1.7"/></g>
    </g>
  </g>
</svg>
