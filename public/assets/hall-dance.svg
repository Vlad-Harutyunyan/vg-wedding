<svg xmlns="http://www.w3.org/2000/svg" width="800" height="640" viewBox="0 0 800 640" role="img" aria-label="Prime Hall dance floor">
  <style>
    @keyframes spin    { 0%{transform:rotate(0)} 100%{transform:rotate(360deg)} }
    @keyframes beampulse{ 0%,100%{opacity:.18} 50%{opacity:.55} }
    @keyframes tile    { 0%{fill:#c7a44a} 25%{fill:#b27c5b} 50%{fill:#8a6fa0} 75%{fill:#5a93a0} 100%{fill:#c7a44a} }
    @keyframes bounce  { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
    @keyframes bounce2 { 0%,100%{transform:translateY(-12px)} 50%{transform:translateY(2px)} }
    @keyframes armsway { 0%,100%{transform:rotate(-16deg)} 50%{transform:rotate(16deg)} }
    @keyframes glint   { 0%,100%{opacity:.4} 50%{opacity:1} }
    @keyframes sweep   { 0%{transform:rotate(-26deg)} 100%{transform:rotate(26deg)} }
    .ballrays { transform-box:fill-box; transform-origin:center; animation:spin 14s linear infinite }
    .ball     { transform-box:fill-box; transform-origin:center; animation:spin 6s linear infinite }
    .beamL { transform-box:fill-box; transform-origin:top center; animation:sweep 3.2s ease-in-out infinite alternate }
    .beamR { transform-box:fill-box; transform-origin:top center; animation:sweep 3.2s ease-in-out infinite alternate-reverse }
    .beam  { animation:beampulse 2.4s ease-in-out infinite }
    .tile  { animation:tile 3.6s linear infinite }
    .tile:nth-of-type(2n){ animation-delay:-.6s } .tile:nth-of-type(3n){ animation-delay:-1.2s }
    .tile:nth-of-type(4n){ animation-delay:-1.8s } .tile:nth-of-type(5n){ animation-delay:-2.4s }
    .dancer  { transform-box:fill-box; transform-origin:bottom center; animation:bounce .62s ease-in-out infinite }
    .dancer.alt{ animation:bounce2 .62s ease-in-out infinite }
    .arm   { transform-box:fill-box; transform-origin:bottom center; animation:armsway .62s ease-in-out infinite }
    .armR  { animation:armsway .62s ease-in-out infinite reverse }
    .glint { animation:glint 1.8s ease-in-out infinite }
    .glint:nth-of-type(2n){ animation-delay:.5s } .glint:nth-of-type(3n){ animation-delay:1s }
  </style>

  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241f30"/>
      <stop offset="1" stop-color="#181522"/>
    </linearGradient>
    <radialGradient id="haze" cx="50%" cy="28%" r="60%">
      <stop offset="0" stop-color="#6a5a86" stop-opacity=".6"/>
      <stop offset="1" stop-color="#6a5a86" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="640" fill="url(#wall)"/>
  <ellipse cx="400" cy="180" rx="360" ry="220" fill="url(#haze)"/>

  <!-- spotlight beams from ceiling corners -->
  <g class="beam"><g class="beamL"><polygon points="120,0 60,470 320,470" fill="#c7a44a" opacity=".5"/></g></g>
  <g class="beam"><g class="beamR"><polygon points="680,0 480,470 740,470" fill="#8a6fa0" opacity=".5"/></g></g>
  <g class="beam"><g class="beamL" style="animation-duration:4.4s"><polygon points="300,0 250,460 470,460" fill="#5a93a0" opacity=".4"/></g></g>

  <!-- disco ball -->
  <line x1="400" y1="40" x2="400" y2="92" stroke="#6b6453" stroke-width="3"/>
  <g class="ballrays">
    <g stroke="#f6e6b8" stroke-width="3" stroke-linecap="round" opacity=".5">
      <line x1="400" y1="60" x2="400" y2="0"/><line x1="400" y1="180" x2="400" y2="240"/>
      <line x1="340" y1="120" x2="280" y2="120"/><line x1="460" y1="120" x2="520" y2="120"/>
      <line x1="357" y1="77" x2="315" y2="35"/><line x1="443" y1="163" x2="485" y2="205"/>
      <line x1="443" y1="77" x2="485" y2="35"/><line x1="357" y1="163" x2="315" y2="205"/>
    </g>
  </g>
  <g class="ball">
    <circle cx="400" cy="120" r="30" fill="#9fb6c9"/>
    <g stroke="#5d6b7a" stroke-width="1.2" opacity=".8">
      <line x1="370" y1="110" x2="430" y2="110"/><line x1="372" y1="120" x2="428" y2="120"/><line x1="370" y1="130" x2="430" y2="130"/>
      <line x1="385" y1="92" x2="385" y2="148"/><line x1="400" y1="90" x2="400" y2="150"/><line x1="415" y1="92" x2="415" y2="148"/>
    </g>
    <rect class="glint" x="386" y="106" width="8" height="8" fill="#fffdf8"/>
    <rect class="glint" x="408" y="124" width="6" height="6" fill="#fffdf8"/>
    <rect class="glint" x="396" y="132" width="5" height="5" fill="#fffdf8"/>
  </g>

  <!-- PRIME HALL neon sign -->
  <text x="400" y="300" text-anchor="middle" font-family="Georgia, serif" font-size="26" letter-spacing="8" fill="#f6dd9c" opacity=".9" style="animation:glint 2.6s ease-in-out infinite">PRIME&#160;HALL</text>

  <!-- ===== glowing dance floor (perspective grid) ===== -->
  <g>
    <polygon points="150,640 650,640 540,432 260,432" fill="#0e0c16"/>
    <!-- back row -->
    <polygon class="tile" points="260,432 305,432 298,470 248,470"/>
    <polygon class="tile" points="320,432 365,432 362,470 312,470"/>
    <polygon class="tile" points="380,432 420,432 422,470 378,470"/>
    <polygon class="tile" points="435,432 480,432 488,470 438,470"/>
    <polygon class="tile" points="495,432 540,432 552,470 502,470"/>
    <!-- middle row -->
    <polygon class="tile" points="245,474 297,474 288,524 230,524"/>
    <polygon class="tile" points="312,474 362,474 360,524 296,524"/>
    <polygon class="tile" points="378,474 422,474 424,524 366,524"/>
    <polygon class="tile" points="438,474 490,474 500,524 432,524"/>
    <polygon class="tile" points="505,474 558,474 570,524 506,524"/>
    <!-- front row -->
    <polygon class="tile" points="226,528 286,528 274,592 204,592"/>
    <polygon class="tile" points="300,528 358,528 356,592 286,592"/>
    <polygon class="tile" points="366,528 424,528 426,592 360,592"/>
    <polygon class="tile" points="434,528 496,528 508,592 430,592"/>
    <polygon class="tile" points="510,528 572,528 588,592 516,592"/>
  </g>

  <!-- ===== dancers (doodle people, arms up) ===== -->
  <g stroke="#2a2520" stroke-linecap="round" stroke-linejoin="round">
    <!-- back-left man -->
    <g transform="translate(322,452) scale(.72)"><g stroke-width="4" fill="#fffefb">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="0.6s" repeatCount="indefinite"/>
      <path d="M-4 4 L-9 24" fill="none"/><path d="M4 4 L9 24" fill="none"/>
      <path d="M-12 6 C-14 -14 -8 -25 0 -25 C8 -25 14 -14 12 6 Z"/>
      <g><animateTransform attributeName="transform" type="rotate" values="-12 -10 -18;6 -10 -18;-12 -10 -18" dur="0.6s" repeatCount="indefinite"/><path d="M-10 -18 C-19 -28 -22 -40 -21 -50" fill="none" stroke-width="5"/></g>
      <g><animateTransform attributeName="transform" type="rotate" values="12 10 -18;-6 10 -18;12 10 -18" dur="0.6s" repeatCount="indefinite"/><path d="M10 -18 C19 -28 22 -40 21 -50" fill="none" stroke-width="5"/></g>
      <circle cx="0" cy="-37" r="12"/>
      <path d="M-11 -40 C-12 -50 -3 -54 5 -53 C12 -52 13 -46 12 -41 C8 -45 1 -45 -3 -43 C-7 -42 -9 -41 -11 -40 Z" fill="#2a2520" stroke="none"/>
      <circle cx="-4.5" cy="-36" r="1.8" fill="#2a2520" stroke="none"/><circle cx="4.5" cy="-36" r="1.8" fill="#2a2520" stroke="none"/>
      <path d="M-4 -31 Q0 -28 4 -31" fill="none" stroke-width="2"/>
    </g></g>
    <!-- back-right woman -->
    <g transform="translate(486,452) scale(.72)"><g stroke-width="4" fill="#fffefb">
      <animateTransform attributeName="transform" type="translate" values="0 -7;0 0;0 -7" dur="0.6s" repeatCount="indefinite"/>
      <path d="M-4 4 L-8 24" fill="none"/><path d="M4 4 L8 24" fill="none"/>
      <path d="M-12 6 C-14 -14 -8 -26 0 -26 C8 -26 14 -14 12 6 Z"/>
      <g><animateTransform attributeName="transform" type="rotate" values="10 -10 -18;-6 -10 -18;10 -10 -18" dur="0.6s" repeatCount="indefinite"/><path d="M-10 -18 C-19 -28 -22 -40 -21 -50" fill="none" stroke-width="5"/></g>
      <g><animateTransform attributeName="transform" type="rotate" values="-12 10 -18;6 10 -18;-12 10 -18" dur="0.6s" repeatCount="indefinite"/><path d="M10 -18 C19 -28 22 -40 21 -50" fill="none" stroke-width="5"/></g>
      <circle cx="0" cy="-39" r="13" fill="#2a2520" stroke="none"/>
      <path d="M-13 -39 C-15 -26 -12 -16 -8 -12 L-4 -12 C-7 -22 -9 -32 -8 -39 Z" fill="#2a2520" stroke="none"/>
      <path d="M13 -39 C15 -26 12 -16 8 -12 L4 -12 C7 -22 9 -32 8 -39 Z" fill="#2a2520" stroke="none"/>
      <circle cx="0" cy="-37" r="11"/>
      <circle cx="-4" cy="-36" r="1.8" fill="#2a2520" stroke="none"/><circle cx="4" cy="-36" r="1.8" fill="#2a2520" stroke="none"/>
      <path d="M-4 -31 Q0 -28 4 -31" fill="none" stroke-width="2"/>
    </g></g>
    <!-- mid-left man -->
    <g transform="translate(286,500) scale(.92)"><g stroke-width="4" fill="#fffefb">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="0.6s" begin="-0.2s" repeatCount="indefinite"/>
      <path d="M-4 4 L-9 24" fill="none"/><path d="M4 4 L9 24" fill="none"/>
      <path d="M-12 6 C-14 -14 -8 -25 0 -25 C8 -25 14 -14 12 6 Z"/>
      <g><animateTransform attributeName="transform" type="rotate" values="-12 -10 -18;6 -10 -18;-12 -10 -18" dur="0.6s" begin="-0.2s" repeatCount="indefinite"/><path d="M-10 -18 C-19 -28 -22 -40 -21 -50" fill="none" stroke-width="5"/></g>
      <g><animateTransform attributeName="transform" type="rotate" values="12 10 -18;-6 10 -18;12 10 -18" dur="0.6s" begin="-0.2s" repeatCount="indefinite"/><path d="M10 -18 C19 -28 22 -40 21 -50" fill="none" stroke-width="5"/></g>
      <circle cx="0" cy="-37" r="12"/>
      <path d="M-11 -40 C-12 -50 -3 -54 5 -53 C12 -52 13 -46 12 -41 C8 -45 1 -45 -3 -43 C-7 -42 -9 -41 -11 -40 Z" fill="#2a2520" stroke="none"/>
      <circle cx="-4.5" cy="-36" r="1.8" fill="#2a2520" stroke="none"/><circle cx="4.5" cy="-36" r="1.8" fill="#2a2520" stroke="none"/>
      <path d="M-4 -31 Q0 -28 4 -31" fill="none" stroke-width="2"/>
    </g></g>
    <!-- mid-right woman -->
    <g transform="translate(516,502) scale(.92)"><g stroke-width="4" fill="#fffefb">
      <animateTransform attributeName="transform" type="translate" values="0 -7;0 0;0 -7" dur="0.6s" begin="-0.3s" repeatCount="indefinite"/>
      <path d="M-4 4 L-8 24" fill="none"/><path d="M4 4 L8 24" fill="none"/>
      <path d="M-12 6 C-14 -14 -8 -26 0 -26 C8 -26 14 -14 12 6 Z"/>
      <g><animateTransform attributeName="transform" type="rotate" values="10 -10 -18;-6 -10 -18;10 -10 -18" dur="0.6s" begin="-0.3s" repeatCount="indefinite"/><path d="M-10 -18 C-19 -28 -22 -40 -21 -50" fill="none" stroke-width="5"/></g>
      <g><animateTransform attributeName="transform" type="rotate" values="-12 10 -18;6 10 -18;-12 10 -18" dur="0.6s" begin="-0.3s" repeatCount="indefinite"/><path d="M10 -18 C19 -28 22 -40 21 -50" fill="none" stroke-width="5"/></g>
      <circle cx="0" cy="-39" r="13" fill="#2a2520" stroke="none"/>
      <path d="M-13 -39 C-15 -26 -12 -16 -8 -12 L-4 -12 C-7 -22 -9 -32 -8 -39 Z" fill="#2a2520" stroke="none"/>
      <path d="M13 -39 C15 -26 12 -16 8 -12 L4 -12 C7 -22 9 -32 8 -39 Z" fill="#2a2520" stroke="none"/>
      <circle cx="0" cy="-37" r="11"/>
      <circle cx="-4" cy="-36" r="1.8" fill="#2a2520" stroke="none"/><circle cx="4" cy="-36" r="1.8" fill="#2a2520" stroke="none"/>
      <path d="M-4 -31 Q0 -28 4 -31" fill="none" stroke-width="2"/>
    </g></g>
    <!-- front groom (bow tie) -->
    <g transform="translate(372,588) scale(1.16)"><g stroke-width="3.6" fill="#fffefb">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="0.6s" begin="-0.1s" repeatCount="indefinite"/>
      <path d="M-4 4 L-9 26" fill="none"/><path d="M4 4 L9 26" fill="none"/>
      <path d="M-12 6 C-14 -16 -8 -27 0 -27 C8 -27 14 -16 12 6 Z"/>
      <path d="M0 -26 L-6 -21 L0 -17 L6 -21 Z" fill="#2a2520" stroke="none"/>
      <g><animateTransform attributeName="transform" type="rotate" values="-12 -11 -20;6 -11 -20;-12 -11 -20" dur="0.6s" begin="-0.1s" repeatCount="indefinite"/><path d="M-11 -20 C-20 -30 -23 -42 -22 -52" fill="none" stroke-width="5"/></g>
      <g><animateTransform attributeName="transform" type="rotate" values="12 11 -20;-6 11 -20;12 11 -20" dur="0.6s" begin="-0.1s" repeatCount="indefinite"/><path d="M11 -20 C20 -30 23 -42 22 -52" fill="none" stroke-width="5"/></g>
      <circle cx="0" cy="-40" r="13"/>
      <path d="M-12 -43 C-13 -54 -3 -58 6 -57 C13 -56 14 -49 13 -44 C9 -48 1 -48 -3 -46 C-7 -45 -10 -44 -12 -43 Z" fill="#2a2520" stroke="none"/>
      <circle cx="-5" cy="-39" r="2" fill="#2a2520" stroke="none"/><circle cx="5" cy="-39" r="2" fill="#2a2520" stroke="none"/>
      <path d="M-4 -33 Q0 -29 4 -33" fill="none" stroke-width="2.2"/>
    </g></g>
    <!-- front bride (veil + dress) -->
    <g transform="translate(452,592) scale(1.18)"><g stroke-width="3.6" fill="#fffefb">
      <animateTransform attributeName="transform" type="translate" values="0 -8;0 0;0 -8" dur="0.6s" begin="-0.25s" repeatCount="indefinite"/>
      <path d="M-16 6 C-14 -18 -8 -30 0 -30 C8 -30 14 -18 16 6 Z"/>
      <g><animateTransform attributeName="transform" type="rotate" values="10 -11 -22;-6 -11 -22;10 -11 -22" dur="0.6s" begin="-0.25s" repeatCount="indefinite"/><path d="M-11 -22 C-20 -32 -23 -44 -22 -54" fill="none" stroke-width="5"/></g>
      <g><animateTransform attributeName="transform" type="rotate" values="-12 11 -22;6 11 -22;-12 11 -22" dur="0.6s" begin="-0.25s" repeatCount="indefinite"/><path d="M11 -22 C20 -32 23 -44 22 -54" fill="none" stroke-width="5"/></g>
      <circle cx="0" cy="-43" r="14" fill="#2a2520" stroke="none"/>
      <path d="M-14 -43 C-16 -28 -13 -16 -8 -11 L-4 -11 C-7 -24 -9 -36 -8 -43 Z" fill="#2a2520" stroke="none"/>
      <path d="M14 -43 C16 -28 13 -16 8 -11 L4 -11 C7 -24 9 -36 8 -43 Z" fill="#2a2520" stroke="none"/>
      <circle cx="0" cy="-41" r="12"/>
      <g stroke-width="2"><circle cx="11" cy="-52" r="3.4" fill="#fffefb"/><circle cx="5" cy="-53" r="3.4" fill="#fffefb"/><circle cx="9" cy="-57" r="3.4" fill="#fffefb"/></g>
      <circle cx="-4.5" cy="-40" r="2" fill="#2a2520" stroke="none"/><circle cx="4.5" cy="-40" r="2" fill="#2a2520" stroke="none"/>
      <path d="M-4 -34 Q0 -30 4 -34" fill="none" stroke-width="2.2"/>
    </g></g>
  </g>
</svg>
