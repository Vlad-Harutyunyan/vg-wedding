<svg xmlns="http://www.w3.org/2000/svg" width="800" height="640" viewBox="0 0 800 640" role="img" aria-label="Prime Hall">
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b3830"/><stop offset=".55" stop-color="#7a6049"/><stop offset="1" stop-color="#c79a63"/>
    </linearGradient>
    <linearGradient id="bldg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a5346"/><stop offset="1" stop-color="#46413a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f6dd9c" stop-opacity=".8"/><stop offset="1" stop-color="#f6dd9c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="640" fill="url(#dusk)"/>

  <!-- stars -->
  <g fill="#fff">
    <circle cx="90"  cy="70" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="40" r="1.6"><animate attributeName="opacity" values=".2;1;.2" dur="4.5s" begin="-1s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="60" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="3.4s" begin="-2s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="44" r="1.6"><animate attributeName="opacity" values=".2;1;.2" dur="4s" begin="-.5s" repeatCount="indefinite"/></circle>
    <circle cx="650" cy="70" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="3.2s" begin="-2.5s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="40" r="1.6"><animate attributeName="opacity" values=".2;1;.2" dur="4.6s" begin="-1.5s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="34" r="1.4"><animate attributeName="opacity" values=".2;1;.2" dur="3.8s" begin="-3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- moon -->
  <circle cx="690" cy="120" r="34" fill="#f3e6c4"/>
  <circle cx="678" cy="112" r="34" fill="url(#dusk)" opacity=".9"/>

  <!-- string lights -->
  <path d="M40 150 Q400 230 760 150" fill="none" stroke="#6e6450" stroke-width="2"/>
  <g fill="#f6dd9c">
    <circle cx="120" cy="184" r="5"><animate attributeName="opacity" values=".55;1;.55" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="200" r="5"><animate attributeName="opacity" values=".55;1;.55" dur="2.4s" begin="-.4s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="210" r="5"><animate attributeName="opacity" values=".55;1;.55" dur="2.4s" begin="-.8s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="212" r="5"><animate attributeName="opacity" values=".55;1;.55" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="208" r="5"><animate attributeName="opacity" values=".55;1;.55" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="198" r="5"><animate attributeName="opacity" values=".55;1;.55" dur="2.4s" begin="-2s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="182" r="5"><animate attributeName="opacity" values=".55;1;.55" dur="2.4s" begin="-2.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- plaza -->
  <rect x="0" y="516" width="800" height="124" fill="#3f3a32"/>
  <rect x="0" y="516" width="800" height="8" fill="#564f43"/>

  <!-- ===== building ===== -->
  <g>
    <ellipse cx="400" cy="380" rx="300" ry="180" fill="url(#glow)" opacity=".5"/>
    <rect x="200" y="250" width="400" height="266" fill="url(#bldg)" stroke="#33302a" stroke-width="2"/>
    <rect x="186" y="234" width="428" height="20" fill="#6a6151"/>
    <g fill="#6f6657"><rect x="216" y="254" width="22" height="262"/><rect x="562" y="254" width="22" height="262"/></g>

    <!-- lit windows (twinkle) -->
    <g>
      <rect x="256" y="276" width="40" height="58" fill="#f6dd9c"><animate attributeName="opacity" values=".35;1;.35" dur="3.2s" repeatCount="indefinite"/></rect>
      <rect x="306" y="276" width="40" height="58" fill="#f3d489"><animate attributeName="opacity" values=".35;1;.35" dur="4.1s" begin="-.6s" repeatCount="indefinite"/></rect>
      <rect x="356" y="276" width="40" height="58" fill="#f6dd9c"><animate attributeName="opacity" values=".35;1;.35" dur="2.6s" begin="-1.1s" repeatCount="indefinite"/></rect>
      <rect x="406" y="276" width="40" height="58" fill="#f0cd7c"><animate attributeName="opacity" values=".35;1;.35" dur="3.6s" begin="-.3s" repeatCount="indefinite"/></rect>
      <rect x="456" y="276" width="40" height="58" fill="#f6dd9c"><animate attributeName="opacity" values=".35;1;.35" dur="4.4s" begin="-1.8s" repeatCount="indefinite"/></rect>
      <rect x="506" y="276" width="40" height="58" fill="#f3d489"><animate attributeName="opacity" values=".35;1;.35" dur="2.9s" begin="-.9s" repeatCount="indefinite"/></rect>
      <rect x="256" y="346" width="40" height="58" fill="#f0cd7c"><animate attributeName="opacity" values=".35;1;.35" dur="3.8s" begin="-1.4s" repeatCount="indefinite"/></rect>
      <rect x="306" y="346" width="40" height="58" fill="#f6dd9c"><animate attributeName="opacity" values=".35;1;.35" dur="2.7s" begin="-.2s" repeatCount="indefinite"/></rect>
      <rect x="356" y="346" width="40" height="58" fill="#f3d489"><animate attributeName="opacity" values=".35;1;.35" dur="4s" begin="-2.1s" repeatCount="indefinite"/></rect>
      <rect x="406" y="346" width="40" height="58" fill="#f6dd9c"><animate attributeName="opacity" values=".35;1;.35" dur="3.3s" begin="-.7s" repeatCount="indefinite"/></rect>
      <rect x="456" y="346" width="40" height="58" fill="#f0cd7c"><animate attributeName="opacity" values=".35;1;.35" dur="4.2s" begin="-1.6s" repeatCount="indefinite"/></rect>
      <rect x="506" y="346" width="40" height="58" fill="#f6dd9c"><animate attributeName="opacity" values=".35;1;.35" dur="2.8s" begin="-1s" repeatCount="indefinite"/></rect>
    </g>

    <path d="M356 516 V452 a44 44 0 0 1 88 0 V516Z" fill="#f6dd9c"/>
    <path d="M356 516 V452 a44 44 0 0 1 88 0 V516Z" fill="none" stroke="#caa766" stroke-width="3"/>
    <line x1="400" y1="408" x2="400" y2="516" stroke="#caa766" stroke-width="2"/>
    <rect x="338" y="516" width="124" height="9" fill="#4d473d"/>
    <rect x="320" y="525" width="160" height="10" fill="#433e35"/>

    <g><animate attributeName="opacity" values=".55;1;.55" dur="3s" repeatCount="indefinite"/>
      <rect x="318" y="206" width="164" height="30" rx="6" fill="#1f1d18" stroke="#caa766" stroke-width="2"/>
      <text x="400" y="227" text-anchor="middle" font-family="Georgia, serif" font-size="18" letter-spacing="5" fill="#f6dd9c">PRIME&#160;HALL</text>
    </g>
  </g>

  <!-- fountain -->
  <g>
    <ellipse cx="400" cy="560" rx="70" ry="18" fill="#5b6a6b"/>
    <ellipse cx="400" cy="558" rx="70" ry="16" fill="#7d9596"/>
    <ellipse cx="400" cy="558" rx="22" ry="6" fill="none" stroke="#cfe0e0" stroke-width="2">
      <animate attributeName="rx" values="7;35" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="2;10" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".8;0" dur="2.4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="400" cy="558" rx="22" ry="6" fill="none" stroke="#cfe0e0" stroke-width="2">
      <animate attributeName="rx" values="7;35" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="2;10" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".8;0" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
    </ellipse>
    <rect x="394" y="540" width="12" height="20" fill="#5b6a6b"/>
    <g fill="#cfe6e6">
      <circle cx="400" cy="540" r="3"><animateTransform attributeName="transform" type="translate" values="0 0;0 -46" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" keyTimes="0;.2;1" dur="1.8s" repeatCount="indefinite"/></circle>
      <circle cx="394" cy="542" r="2.5"><animateTransform attributeName="transform" type="translate" values="0 0;0 -46" dur="1.8s" begin="-.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" keyTimes="0;.2;1" dur="1.8s" begin="-.6s" repeatCount="indefinite"/></circle>
      <circle cx="406" cy="542" r="2.5"><animateTransform attributeName="transform" type="translate" values="0 0;0 -46" dur="1.8s" begin="-1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" keyTimes="0;.2;1" dur="1.8s" begin="-1.2s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- passed-out guest sleeping by the left tree, bottle beside him -->
  <g>
    <ellipse cx="180" cy="552" rx="34" ry="7" fill="#000" opacity=".18"/>
    <rect x="196" y="544" width="22" height="8" rx="4" fill="#26231e"/>
    <rect x="208" y="540" width="20" height="8" rx="4" fill="#2f2b26" transform="rotate(-12 208 544)"/>
    <rect x="162" y="540" width="42" height="12" rx="6" fill="#52372a"/>
    <circle cx="158" cy="544" r="7.5" fill="#e8c4a0"/>
    <path d="M150.5 544 a7.5 7.5 0 0 1 15 0 q-7.5 3.4 -15 0 Z" fill="#2e2014"/>
    <g transform="rotate(-18 142 548)">
      <rect x="132" y="544" width="14" height="6" rx="2" fill="#6f8d6a"/>
      <rect x="146" y="545" width="4" height="4" fill="#6f8d6a"/>
    </g>
    <g fill="#cfe6e6" font-family="Georgia, serif" font-weight="bold">
      <text x="168" y="528" font-size="11">z<animateTransform attributeName="transform" type="translate" values="0 0;10 -22" dur="3.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;0" keyTimes="0;.2;1" dur="3.4s" repeatCount="indefinite"/></text>
      <text x="176" y="520" font-size="13">z<animateTransform attributeName="transform" type="translate" values="0 0;10 -22" dur="3.4s" begin="-1.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;0" keyTimes="0;.2;1" dur="3.4s" begin="-1.1s" repeatCount="indefinite"/></text>
      <text x="184" y="512" font-size="15">z<animateTransform attributeName="transform" type="translate" values="0 0;10 -22" dur="3.4s" begin="-2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;0" keyTimes="0;.2;1" dur="3.4s" begin="-2.2s" repeatCount="indefinite"/></text>
    </g>
  </g>

  <!-- tipsy guest staggering across the plaza -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;28 0;12 0;56 0;70 0;56 0;12 0;28 0;0 0" dur="52s" calcMode="spline" keyTimes="0;.125;.25;.375;.5;.625;.75;.875;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    <g transform="translate(244,500)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-10 0 50;11 0 50;-10 0 50" dur="3.2s" calcMode="spline" keyTimes="0;.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
        <rect x="-6" y="34" width="5" height="16" rx="2" fill="#26231e"/>
        <rect x="2" y="34" width="5" height="16" rx="2" fill="#26231e"/>
        <rect x="-9" y="13" width="18" height="26" rx="5" fill="#52372a"/>
        <path d="M-2 14 L2 14 L1 26 L-1 26 Z" fill="#d8cbb6"/>
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="3.2s" repeatCount="indefinite"/>
          <rect x="6" y="14" width="4" height="15" rx="2" fill="#52372a" transform="rotate(48 8 15)"/>
          <rect x="17" y="16" width="5" height="12" rx="2" fill="#6f8d6a"/>
          <rect x="18" y="13" width="3" height="5" fill="#6f8d6a"/>
        </g>
        <rect x="-10" y="16" width="4" height="16" rx="2" fill="#52372a" transform="rotate(-22 -8 17)"/>
        <circle cx="0" cy="6" r="6" fill="#e8c4a0"/>
        <circle cx="-3" cy="8" r="1.6" fill="#d98b6e" opacity=".7"/>
        <circle cx="3" cy="8" r="1.6" fill="#d98b6e" opacity=".7"/>
        <path d="M-6 6 a6 6 0 0 1 12 0 q-6 2.7 -12 0 Z" fill="#2e2014"/>
      </g>
    </g>
  </g>

  <!-- potted trees -->
  <g>
    <rect x="150" y="486" width="16" height="30" fill="#5a4632"/>
    <circle cx="158" cy="476" r="24" fill="#5f6a47"/>
    <rect x="634" y="486" width="16" height="30" fill="#5a4632"/>
    <circle cx="642" cy="476" r="24" fill="#5f6a47"/>
  </g>
</svg>
