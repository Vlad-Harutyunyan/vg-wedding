      <g stroke-width="0.8"><line x1="148" y1="150" x2="148" y2="162"/><line x1="160" y1="150" x2="160" y2="162"/><line x1="172" y1="150" x2="172" y2="162"/><line x1="184" y1="150" x2="184" y2="162"/><line x1="196" y1="150" x2="196" y2="162"/><line x1="208" y1="150" x2="208" y2="162"/><line x1="220" y1="150" x2="220" y2="162"/><line x1="232" y1="150" x2="232" y2="162"/><line x1="244" y1="150" x2="244" y2="162"/></g>
