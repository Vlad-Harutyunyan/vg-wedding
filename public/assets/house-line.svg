    <g><line x1="288" y1="262" x2="288" y2="408"/><line x1="296" y1="262" x2="296" y2="408"/><line x1="404" y1="262" x2="404" y2="408"/><line x1="412" y1="262" x2="412" y2="408"/>
       <line x1="284" y1="262" x2="300" y2="262"/><line x1="400" y1="262" x2="416" y2="262"/><line x1="284" y1="408" x2="300" y2="408"/><line x1="400" y1="408" x2="416" y2="408"/></g>
