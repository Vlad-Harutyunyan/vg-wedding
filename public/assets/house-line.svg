    <g>
      <g transform="translate(150,438)"><path d="M-9 0 L9 0 L6 -16 L-6 -16 Z"/><line x1="-7" y1="-4" x2="7" y2="-4" stroke-width="0.8"/><g stroke-width="0.9"><circle cx="0" cy="-22" r="5"/><circle cx="-7" cy="-19" r="4"/><circle cx="7" cy="-19" r="4"/></g></g>
      <g transform="translate(550,438)"><path d="M-9 0 L9 0 L6 -16 L-6 -16 Z"/><line x1="-7" y1="-4" x2="7" y2="-4" stroke-width="0.8"/><g stroke-width="0.9"><circle cx="0" cy="-22" r="5"/><circle cx="-7" cy="-19" r="4"/><circle cx="7" cy="-19" r="4"/></g></g>
      <g transform="translate(286,438)"><path d="M-7 0 L7 0 L5 -13 L-5 -13 Z"/><g stroke-width="0.9"><circle cx="0" cy="-18" r="4"/><circle cx="-6" cy="-16" r="3.4"/><circle cx="6" cy="-16" r="3.4"/></g></g>
      <g transform="translate(414,438)"><path d="M-7 0 L7 0 L5 -13 L-5 -13 Z"/><g stroke-width="0.9"><circle cx="0" cy="-18" r="4"/><circle cx="-6" cy="-16" r="3.4"/><circle cx="6" cy="-16" r="3.4"/></g></g>
