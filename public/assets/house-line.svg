      <line x1="430" y1="162" x2="576" y2="162"/><line x1="434" y1="150" x2="572" y2="150"/>
      <rect x="444" y="150" width="118" height="12"/>
      <g stroke-width="0.8"><line x1="456" y1="150" x2="456" y2="162"/><line x1="468" y1="150" x2="468" y2="162"/><line x1="480" y1="150" x2="480" y2="162"/><line x1="492" y1="150" x2="492" y2="162"/><line x1="504" y1="150" x2="504" y2="162"/><line x1="516" y1="150" x2="516" y2="162"/><line x1="528" y1="150" x2="528" y2="162"/><line x1="540" y1="150" x2="540" y2="162"/><line x1="552" y1="150" x2="552" y2="162"/></g>
      <path d="M438 150 q-6 -10 6 -14 q12 4 6 14"/><path d="M562 150 q-6 -10 6 -14 q12 4 6 14"/>
