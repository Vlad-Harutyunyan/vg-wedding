    <g stroke-width="0.8"><line x1="306" y1="252" x2="306" y2="262"/><line x1="316" y1="252" x2="316" y2="262"/><line x1="326" y1="252" x2="326" y2="262"/><line x1="336" y1="252" x2="336" y2="262"/><line x1="346" y1="252" x2="346" y2="262"/><line x1="356" y1="252" x2="356" y2="262"/><line x1="366" y1="252" x2="366" y2="262"/><line x1="376" y1="252" x2="376" y2="262"/><line x1="386" y1="252" x2="386" y2="262"/><line x1="394" y1="252" x2="394" y2="262"/></g>
    <g><path d="M306 252 q-5 -6 0 -12 q5 6 0 12"/><path d="M350 252 q-6 -7 0 -14 q6 7 0 14"/><path d="M394 252 q-5 -6 0 -12 q5 6 0 12"/></g>
