    <path d="M312 250 V214 a38 30 0 0 1 76 0 V250" stroke-width="0.9"/>
    <g stroke-width="0.7" opacity=".75"><line x1="350" y1="214" x2="350" y2="184"/><line x1="350" y1="214" x2="324" y2="188"/><line x1="350" y1="214" x2="376" y2="188"/><line x1="350" y1="214" x2="312" y2="204"/><line x1="350" y1="214" x2="388" y2="204"/></g>
    <circle cx="350" cy="214" r="6" stroke-width="0.8"/>
    <line x1="306" y1="250" x2="394" y2="250"/>
