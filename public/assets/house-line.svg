    <path d="M327 408 V322 a23 23 0 0 1 46 0 V408" stroke-width="0.9"/>
    <line x1="350" y1="299" x2="350" y2="408" stroke-width="0.9"/>
    <path d="M338 306 l24 0" stroke-width="0.8"/>
