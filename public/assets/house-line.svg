<svg xmlns="http://www.w3.org/2000/svg" width="700" height="470" viewBox="0 0 700 470" role="img" aria-label="Jasmin Wedding White House">
  <g fill="none" stroke="#b08d57" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">

