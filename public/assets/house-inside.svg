<svg xmlns="http://www.w3.org/2000/svg" width="800" height="640" viewBox="0 0 800 640" role="img" aria-label="The first toast">
  <style>
    @keyframes clink  { 0%,100%{transform:translateY(0) rotate(0)} 50%{transform:translateY(-5px) rotate(-3deg)} }
    @keyframes clink2 { 0%,100%{transform:translateY(0) rotate(0)} 50%{transform:translateY(-5px) rotate(3deg)} }
    @keyframes rise   { 0%{transform:translateY(0);opacity:0} 25%{opacity:1} 100%{transform:translateY(-12px);opacity:0} }
    @keyframes ray    { 0%,100%{opacity:.35} 50%{opacity:.65} }
    @keyframes twinkle{ 0%,100%{opacity:.2; transform:scale(.7)} 50%{opacity:1; transform:scale(1.1)} }
    .toast  { transform-box:fill-box; transform-origin:bottom center; animation:clink 3s ease-in-out infinite }
    .toast2 { transform-box:fill-box; transform-origin:bottom center; animation:clink2 3s ease-in-out infinite }
    .bub  { transform-box:fill-box; transform-origin:center; animation:rise 2.2s ease-in-out infinite }
    .bub:nth-of-type(2n){ animation-delay:.7s } .bub:nth-of-type(3n){ animation-delay:1.3s }
    .ray  { animation:ray 5s ease-in-out infinite }
    .tw   { transform-box:fill-box; transform-origin:center; animation:twinkle 2.6s ease-in-out infinite }
    .tw:nth-of-type(2n){ animation-delay:.8s } .tw:nth-of-type(3n){ animation-delay:1.6s }
  </style>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1e3cd"/><stop offset="1" stop-color="#e3d2b6"/>
    </linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffefb"/><stop offset="1" stop-color="#efe2cd"/>
    </linearGradient>
  </defs>

  <rect width="800" height="640" fill="url(#wall)"/>
  <!-- wainscot -->
  <rect x="0" y="430" width="800" height="210" fill="#e7d7bb"/>
  <rect x="0" y="430" width="800" height="8" fill="#d8c4a0"/>
  <g stroke="#d3bf9b" stroke-width="2" fill="none" opacity=".7">
    <rect x="40" y="452" width="120" height="150" rx="4"/><rect x="640" y="452" width="120" height="150" rx="4"/>
  </g>

  <!-- window with morning light (left) -->
  <g>
    <rect x="86" y="150" width="150" height="180" rx="4" fill="#cfe0e8"/>
    <rect x="86" y="150" width="150" height="180" rx="4" fill="none" stroke="#e7ddcb" stroke-width="8"/>
    <line x1="161" y1="150" x2="161" y2="330" stroke="#e7ddcb" stroke-width="6"/>
    <line x1="86" y1="240" x2="236" y2="240" stroke="#e7ddcb" stroke-width="6"/>
    <circle cx="190" cy="200" r="26" fill="#f6e6b0"/>
  </g>
  <!-- light rays into the room -->
  <g class="ray" fill="#f8eccb">
    <polygon points="100,180 260,180 470,560 250,560" opacity=".4"/>
    <polygon points="150,180 230,180 360,560 250,560" opacity=".35"/>
  </g>

  <!-- chandelier -->
  <g>
    <line x1="560" y1="80" x2="560" y2="130" stroke="#b69a5c" stroke-width="3"/>
    <ellipse cx="560" cy="138" rx="40" ry="9" fill="none" stroke="#c7a965" stroke-width="3"/>
    <g fill="#f6e3a0"><ellipse class="tw" cx="528" cy="134" rx="3" ry="6"/><ellipse class="tw" cx="560" cy="138" rx="3" ry="6"/><ellipse class="tw" cx="592" cy="134" rx="3" ry="6"/></g>
  </g>

  <!-- ===== people raising the first toast (stand BEHIND the table) ===== -->
  <!-- guest left -->
  <g transform="translate(250,500)">
    <path d="M-16 0 q16 -12 32 0 L14 -2 L14 -64 q-14 -10 -28 0 L-14 -2 Z" fill="#7c5a8a"/>
    <circle cx="0" cy="-72" r="13" fill="#e6c19c"/><path d="M-13 -74.3 Q0 -85.3 13 -74.3 Q0 -76.2 -13 -74.3 Z" fill="#2e2014"/>
    <g class="toast2">
      <rect x="12" y="-92" width="6" height="26" rx="3" fill="#e6c19c" transform="rotate(-32 15 -66)"/>
      <g transform="translate(2,-104)"><polygon points="-5,0 5,0 2,12 -2,12" fill="#f1dd96"/><rect x="-1" y="12" width="2" height="12" fill="#d9c98f"/><ellipse cx="0" cy="22" rx="6" ry="2.5" fill="#d9c98f"/>
        <circle class="bub" cx="-1" cy="6" r="1.2" fill="#fff8df"/><circle class="bub" cx="2" cy="8" r="1" fill="#fff8df"/></g>
    </g>
  </g>

  <!-- groom -->
  <g transform="translate(330,504)">
    <path d="M-17 0 q17 -12 34 0 L15 -2 L15 -70 q-15 -11 -30 0 L-15 -2 Z" fill="#3a3744"/>
    <path d="M-2 -70 L2 -70 L1 -4 L-1 -4 Z" fill="#e6dcc8"/>
    <circle cx="0" cy="-80" r="13" fill="#e6c19c"/><path d="M-13 -82.3 Q0 -93.3 13 -82.3 Q0 -84.2 -13 -82.3 Z" fill="#2e2014"/>
    <g class="toast">
      <rect x="12" y="-100" width="6" height="28" rx="3" fill="#e6c19c" transform="rotate(34 15 -72)"/>
      <g transform="translate(26,-112)"><polygon points="-5,0 5,0 2,12 -2,12" fill="#f1dd96"/><rect x="-1" y="12" width="2" height="12" fill="#d9c98f"/><ellipse cx="0" cy="22" rx="6" ry="2.5" fill="#d9c98f"/>
        <circle class="bub" cx="-1" cy="6" r="1.2" fill="#fff8df"/><circle class="bub" cx="2" cy="9" r="1" fill="#fff8df"/></g>
    </g>
  </g>

  <!-- bride (centre) -->
  <g transform="translate(420,506)">
    <path d="M-26 0 q26 -16 52 0 L18 -4 L14 -74 q-14 -11 -28 0 L-18 -4 Z" fill="#fffefb"/>
    <circle cx="0" cy="-84" r="13" fill="#eecaa6"/>
    <path d="M-13 -86.3 Q0 -97.6 13 -86.3 l-2 13 q-11 -5 -22 0 Z" fill="#5a3a22"/>
    <circle cx="0" cy="-90" r="3" fill="#e9cf86"/>
    <path d="M12 -86 q14 6 9 40" fill="none" stroke="#fffefb" stroke-width="3" opacity=".7"/>
    <g class="toast2">
      <rect x="-18" y="-104" width="6" height="28" rx="3" fill="#eecaa6" transform="rotate(-34 -15 -76)"/>
      <g transform="translate(-30,-116)"><polygon points="-5,0 5,0 2,12 -2,12" fill="#f1dd96"/><rect x="-1" y="12" width="2" height="12" fill="#d9c98f"/><ellipse cx="0" cy="22" rx="6" ry="2.5" fill="#d9c98f"/>
        <circle class="bub" cx="-1" cy="6" r="1.2" fill="#fff8df"/><circle class="bub" cx="2" cy="8" r="1" fill="#fff8df"/></g>
    </g>
  </g>

  <!-- guest right -->
  <g transform="translate(530,502)">
    <path d="M-16 0 q16 -12 32 0 L14 -2 L14 -66 q-14 -10 -28 0 L-14 -2 Z" fill="#4f7fb0"/>
    <circle cx="0" cy="-74" r="13" fill="#e6c19c"/>
    <path d="M-13 -76.3 Q0 -87.6 13 -76.3 l-2 13 q-11 -5 -22 0 Z" fill="#c9a96a"/>
    <g class="toast">
      <rect x="-18" y="-94" width="6" height="26" rx="3" fill="#e6c19c" transform="rotate(30 -15 -68)"/>
      <g transform="translate(-30,-106)"><polygon points="-5,0 5,0 2,12 -2,12" fill="#f1dd96"/><rect x="-1" y="12" width="2" height="12" fill="#d9c98f"/><ellipse cx="0" cy="22" rx="6" ry="2.5" fill="#d9c98f"/>
        <circle class="bub" cx="-1" cy="6" r="1.2" fill="#fff8df"/><circle class="bub" cx="2" cy="9" r="1" fill="#fff8df"/></g>
    </g>
  </g>

  <!-- table drawn IN FRONT so people stand behind it -->
  <rect x="170" y="486" width="460" height="120" fill="url(#cloth)"/>
  <ellipse cx="400" cy="486" rx="230" ry="26" fill="#fffefb" stroke="#e7d8bd" stroke-width="2"/>
  <!-- champagne bottle + spare glasses on the table -->
  <g>
    <rect x="300" y="446" width="16" height="44" rx="4" fill="#3f5a3a"/>
    <rect x="304" y="430" width="8" height="20" rx="3" fill="#3f5a3a"/>
    <rect x="302" y="452" width="12" height="16" fill="#caa765" opacity=".8"/>
    <rect x="470" y="466" width="3" height="22" fill="#cfe0e0"/><polygon points="463,452 483,452 473,468 467,468" fill="#e7d49a"/>
    <rect x="494" y="466" width="3" height="22" fill="#cfe0e0"/><polygon points="487,452 507,452 497,468 491,468" fill="#e7d49a"/>
  </g>

  <!-- sparkles -->
  <g fill="#f4dd8c">
    <path class="tw" d="M360 360 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 Z"/>
    <path class="tw" d="M470 330 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5 Z"/>
    <path class="tw" d="M300 300 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 Z"/>
  </g>
</svg>
