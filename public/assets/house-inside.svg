<svg xmlns="http://www.w3.org/2000/svg" width="800" height="640" viewBox="0 0 800 640" role="img" aria-label="The first toast">
  <style>
    @keyframes clink  { 0%,100%{transform:translateY(0) rotate(0)} 50%{transform:translateY(-5px) rotate(-3deg)} }
    @keyframes clink2 { 0%,100%{transform:translateY(0) rotate(0)} 50%{transform:translateY(-5px) rotate(3deg)} }
    @keyframes rise   { 0%{transform:translateY(0);opacity:0} 25%{opacity:1} 100%{transform:translateY(-12px);opacity:0} }
    @keyframes ray    { 0%,100%{opacity:.35} 50%{opacity:.65} }
    @keyframes twinkle{ 0%,100%{opacity:.2; transform:scale(.7)} 50%{opacity:1; transform:scale(1.1)} }
    .toast  { transform-box:fill-box; transform-origin:bottom center; animation:clink 3s ease-in-out infinite }
    .toast2 { transform-box:fill-box; transform-origin:bottom center; animation:clink2 3s ease-in-out infinite }
    .bub  { transform-box:fill-box; transform-origin:center; animation:rise 2.2s ease-in-out infinite }
    .bub:nth-of-type(2n){ animation-delay:.7s } .bub:nth-of-type(3n){ animation-delay:1.3s }
    .ray  { animation:ray 5s ease-in-out infinite }
    .tw   { transform-box:fill-box; transform-origin:center; animation:twinkle 2.6s ease-in-out infinite }
    .tw:nth-of-type(2n){ animation-delay:.8s } .tw:nth-of-type(3n){ animation-delay:1.6s }
  </style>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1e3cd"/><stop offset="1" stop-color="#e3d2b6"/>
    </linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffefb"/><stop offset="1" stop-color="#efe2cd"/>
    </linearGradient>
  </defs>

  <rect width="800" height="640" fill="url(#wall)"/>
  <!-- wainscot -->
  <rect x="0" y="430" width="800" height="210" fill="#e7d7bb"/>
  <rect x="0" y="430" width="800" height="8" fill="#d8c4a0"/>
  <g stroke="#d3bf9b" stroke-width="2" fill="none" opacity=".7">
    <rect x="40" y="452" width="120" height="150" rx="4"/><rect x="640" y="452" width="120" height="150" rx="4"/>
  </g>

  <!-- window with morning light (left) -->
  <g>
    <rect x="86" y="150" width="150" height="180" rx="4" fill="#cfe0e8"/>
    <rect x="86" y="150" width="150" height="180" rx="4" fill="none" stroke="#e7ddcb" stroke-width="8"/>
    <line x1="161" y1="150" x2="161" y2="330" stroke="#e7ddcb" stroke-width="6"/>
    <line x1="86" y1="240" x2="236" y2="240" stroke="#e7ddcb" stroke-width="6"/>
    <circle cx="190" cy="200" r="26" fill="#f6e6b0"/>
  </g>
  <!-- light rays into the room -->
  <g class="ray" fill="#f8eccb">
    <polygon points="100,180 260,180 470,560 250,560" opacity=".4"/>
    <polygon points="150,180 230,180 360,560 250,560" opacity=".35"/>
  </g>

  <!-- chandelier -->
  <g>
    <line x1="560" y1="80" x2="560" y2="130" stroke="#b69a5c" stroke-width="3"/>
    <ellipse cx="560" cy="138" rx="40" ry="9" fill="none" stroke="#c7a965" stroke-width="3"/>
    <g fill="#f6e3a0"><ellipse class="tw" cx="528" cy="134" rx="3" ry="6"/><ellipse class="tw" cx="560" cy="138" rx="3" ry="6"/><ellipse class="tw" cx="592" cy="134" rx="3" ry="6"/></g>
  </g>

  <!-- ===== people raising the first toast — everyone clinks toward the centre ===== -->
  <!-- guest left (raises right arm) -->
  <g transform="translate(248,478)" stroke="#2a2520" stroke-width="3.4" fill="#fffefb" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-20 6 C-22 -22 -13 -34 0 -34 C13 -34 22 -22 20 6 Z"/>
    <circle cx="0" cy="-50" r="16"/>
    <path d="M-15 -54 C-16 -68 -4 -73 8 -72 C16 -71 18 -63 16 -55 C11 -60 1 -60 -5 -58 C-10 -56 -13 -55 -15 -54 Z" fill="#2a2520" stroke="none"/>
    <path d="M4 -68 C-3 -64 -9 -59 -13 -55" stroke="#fffefb" stroke-width="1.5" fill="none"/>
    <circle cx="-6" cy="-49" r="2.4" fill="#2a2520" stroke="none"/><circle cx="6" cy="-49" r="2.4" fill="#2a2520" stroke="none"/>
    <path d="M-6 -43 Q0 -38 6 -43" fill="none" stroke-width="2.6"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 15 -26;-19 15 -26;-24 15 -26;-16 15 -26;-19 15 -26;0 15 -26" keyTimes="0;0.30;0.39;0.45;0.58;1" dur="3.4s" repeatCount="indefinite"/>
      <path d="M15 -26 C26 -34 31 -50 31 -60" fill="none" stroke-width="6"/>
      <polygon points="24 -62 38 -62 31 -50" fill="#f6e7bf"/><path d="M31 -50 L31 -42 M25 -42 L37 -42" fill="none"/>
      <circle cx="29" cy="-58" r="1.4" fill="#fff8df" stroke="none"/><circle cx="33" cy="-56" r="1.1" fill="#fff8df" stroke="none"/>
    </g>
  </g>

  <!-- groom (bow tie, raises right arm) -->
  <g transform="translate(335,482)" stroke="#2a2520" stroke-width="3.4" fill="#fffefb" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-21 6 C-23 -22 -14 -35 0 -35 C14 -35 23 -22 21 6 Z"/>
    <path d="M-2 -34 L2 -34 L1 6 L-1 6 Z" stroke-width="2.6"/>
    <path d="M0 -34 L-7 -28 L0 -24 L7 -28 Z" fill="#2a2520" stroke="none"/>
    <circle cx="0" cy="-52" r="16"/>
    <path d="M-15 -56 C-16 -70 -4 -75 8 -74 C16 -73 18 -65 16 -57 C11 -62 1 -62 -5 -60 C-10 -58 -13 -57 -15 -56 Z" fill="#2a2520" stroke="none"/>
    <path d="M4 -70 C-3 -66 -9 -61 -13 -57" stroke="#fffefb" stroke-width="1.5" fill="none"/>
    <circle cx="-6" cy="-51" r="2.4" fill="#2a2520" stroke="none"/><circle cx="6" cy="-51" r="2.4" fill="#2a2520" stroke="none"/>
    <path d="M-6 -45 Q0 -40 6 -45" fill="none" stroke-width="2.6"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 16 -27;-19 16 -27;-24 16 -27;-16 16 -27;-19 16 -27;0 16 -27" keyTimes="0;0.30;0.39;0.45;0.58;1" dur="3.4s" repeatCount="indefinite"/>
      <path d="M16 -27 C27 -35 32 -52 32 -62" fill="none" stroke-width="6"/>
      <polygon points="25 -64 39 -64 32 -52" fill="#f6e7bf"/><path d="M32 -52 L32 -44 M26 -44 L38 -44" fill="none"/>
      <circle cx="30" cy="-60" r="1.4" fill="#fff8df" stroke="none"/><circle cx="34" cy="-58" r="1.1" fill="#fff8df" stroke="none"/>
    </g>
  </g>

  <!-- bride centre (flower, raises left arm) -->
  <g transform="translate(420,484)" stroke="#2a2520" stroke-width="3.4" fill="#fffefb" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-22 6 C-24 -24 -14 -36 0 -36 C14 -36 24 -24 22 6 Z"/>
    <circle cx="0" cy="-55" r="18" fill="#2a2520" stroke="none"/>
    <path d="M-18 -55 C-20 -36 -18 -20 -13 -14 L-7 -14 C-11 -28 -13 -42 -12 -55 Z" fill="#2a2520" stroke="none"/>
    <path d="M18 -55 C20 -36 18 -20 13 -14 L7 -14 C11 -28 13 -42 12 -55 Z" fill="#2a2520" stroke="none"/>
    <circle cx="0" cy="-52" r="14"/>
    <g stroke-width="2"><circle cx="14" cy="-64" r="4" fill="#fffefb"/><circle cx="7" cy="-66" r="4" fill="#fffefb"/><circle cx="12" cy="-70" r="4" fill="#fffefb"/><circle cx="11" cy="-66" r="1.6" fill="#e9cf86" stroke="none"/></g>
    <circle cx="-5" cy="-51" r="2.3" fill="#2a2520" stroke="none"/><circle cx="5" cy="-51" r="2.3" fill="#2a2520" stroke="none"/>
    <circle cx="-9" cy="-46" r="2.6" fill="#e2a59a" stroke="none" opacity=".5"/><circle cx="9" cy="-46" r="2.6" fill="#e2a59a" stroke="none" opacity=".5"/>
    <path d="M-5 -45 Q0 -41 5 -45" fill="none" stroke-width="2.4"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 -16 -29;19 -16 -29;24 -16 -29;16 -16 -29;19 -16 -29;0 -16 -29" keyTimes="0;0.30;0.39;0.45;0.58;1" dur="3.4s" repeatCount="indefinite"/>
      <path d="M-16 -29 C-27 -37 -32 -54 -32 -64" fill="none" stroke-width="6"/>
      <polygon points="-39 -66 -25 -66 -32 -54" fill="#f6e7bf"/><path d="M-32 -54 L-32 -46 M-38 -46 L-26 -46" fill="none"/>
      <circle cx="-30" cy="-62" r="1.4" fill="#fff8df" stroke="none"/><circle cx="-34" cy="-60" r="1.1" fill="#fff8df" stroke="none"/>
    </g>
  </g>

  <!-- guest right (raises left arm) -->
  <g transform="translate(516,480)" stroke="#2a2520" stroke-width="3.4" fill="#fffefb" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-20 6 C-22 -22 -13 -34 0 -34 C13 -34 22 -22 20 6 Z"/>
    <circle cx="0" cy="-53" r="18" fill="#2a2520" stroke="none"/>
    <path d="M-18 -53 C-20 -36 -16 -22 -11 -16 L-6 -16 C-10 -28 -12 -40 -11 -53 Z" fill="#2a2520" stroke="none"/>
    <path d="M18 -53 C20 -36 16 -22 11 -16 L6 -16 C10 -28 12 -40 11 -53 Z" fill="#2a2520" stroke="none"/>
    <circle cx="0" cy="-50" r="14"/>
    <circle cx="-5" cy="-49" r="2.3" fill="#2a2520" stroke="none"/><circle cx="5" cy="-49" r="2.3" fill="#2a2520" stroke="none"/>
    <circle cx="-9" cy="-44" r="2.6" fill="#e2a59a" stroke="none" opacity=".5"/><circle cx="9" cy="-44" r="2.6" fill="#e2a59a" stroke="none" opacity=".5"/>
    <path d="M-5 -43 Q0 -39 5 -43" fill="none" stroke-width="2.4"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 -15 -26;19 -15 -26;24 -15 -26;16 -15 -26;19 -15 -26;0 -15 -26" keyTimes="0;0.30;0.39;0.45;0.58;1" dur="3.4s" repeatCount="indefinite"/>
      <path d="M-15 -26 C-26 -34 -31 -50 -31 -60" fill="none" stroke-width="6"/>
      <polygon points="-38 -62 -24 -62 -31 -50" fill="#f6e7bf"/><path d="M-31 -50 L-31 -42 M-37 -42 L-25 -42" fill="none"/>
      <circle cx="-29" cy="-58" r="1.4" fill="#fff8df" stroke="none"/><circle cx="-33" cy="-56" r="1.1" fill="#fff8df" stroke="none"/>
    </g>
  </g>

  <!-- table drawn IN FRONT so people stand behind it -->
  <rect x="170" y="486" width="460" height="120" fill="url(#cloth)"/>
  <ellipse cx="400" cy="486" rx="230" ry="26" fill="#fffefb" stroke="#e7d8bd" stroke-width="2"/>
  <!-- champagne bottle + spare glasses on the table -->
  <g>
    <rect x="300" y="446" width="16" height="44" rx="4" fill="#3f5a3a"/>
    <rect x="304" y="430" width="8" height="20" rx="3" fill="#3f5a3a"/>
    <rect x="302" y="452" width="12" height="16" fill="#caa765" opacity=".8"/>
    <rect x="470" y="466" width="3" height="22" fill="#cfe0e0"/><polygon points="463,452 483,452 473,468 467,468" fill="#e7d49a"/>
    <rect x="494" y="466" width="3" height="22" fill="#cfe0e0"/><polygon points="487,452 507,452 497,468 491,468" fill="#e7d49a"/>
  </g>

  <!-- sparkles -->
  <g fill="#f4dd8c">
    <path class="tw" d="M360 360 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 Z"/>
    <path class="tw" d="M470 330 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5 Z"/>
    <path class="tw" d="M300 300 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 Z"/>
  </g>
</svg>
